name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalacija paketa
        run: npm ci

      - name: Android projekat, ikonice i splash
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          mkdir -p android/app/src/main/res/drawable
          cp assets/ic_stat_leaf.png android/app/src/main/res/drawable/ic_stat_leaf.png
          npx cap sync android

      - name: Verzija aplikacije
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Stalni ključ za potpis (da se nova verzija instalira preko stare)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Pravljenje APK-a
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../meni-po-meri.apk

      - uses: actions/upload-artifact@v4
        with:
          name: meni-po-meri-apk
          path: meni-po-meri.apk

      - name: Objava u Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Meni po meri 1.0.${{ github.run_number }}
          body: Instaliraj meni-po-meri.apk na telefonu. Nova verzija se instalira preko stare i podaci ostaju.
          files: meni-po-meri.apk
          make_latest: true
