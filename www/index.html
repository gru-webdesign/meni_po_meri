/* Layout: one-thumb mobile app. Dark summary card on top, tap-to-log tiles, compact meal timeline, details in bottom sheets, fixed tab bar.
   Shape rule: cards 20px, inputs 12px, every button and chip is a full pill. One accent (green); red only for warnings and Coca-Cola. */
:root{
  --bg:#F4F6F1; --surface:#FFFFFF; --sunk:#EEF2EA; --ink:#141A15; --muted:#5A675E; --line:#E0E6DB;
  --accent:#12803E; --on-accent:#FFFFFF; --accent-soft:#DDF1E3; --accent-ink:#0B5A2B;
  --red:#C9243A; --red-soft:#FCE4E7;
  --amber:#B86E00; --amber-soft:#FDEFD2; --blue:#2B6CC4; --blue-soft:#E2ECFA; --hero:#E4F2E7;
  --night:#FFFFFF; --night-2:#EEF3EE; --night-ink:#141A15; --night-muted:#5A675E; --ring-track:#E3EBE4;
  --font:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --display:"Bricolage Grotesque", "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --r-card:24px; --r-input:14px;
  --shadow:0 1px 1px rgba(28,48,30,.04), 0 6px 20px rgba(28,48,30,.06);
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C100D; --surface:#161C18; --sunk:#111613; --ink:#ECF2ED; --muted:#9AA99F; --line:#253029;
  --accent:#3BCB78; --on-accent:#06120A; --accent-soft:#163522; --accent-ink:#A8EDC3;
  --red:#FF5C70; --red-soft:#3B151B;
  --amber:#F2B544; --amber-soft:#3A2B0E; --blue:#79AEF2; --blue-soft:#14253F; --hero:#132A1C;
  --night:#18211B; --night-2:#222D26; --night-ink:#EEF4EF; --night-muted:#9EAEA3; --ring-track:#2E3B33;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C100D; --surface:#161C18; --sunk:#111613; --ink:#ECF2ED; --muted:#9AA99F; --line:#253029;
  --accent:#3BCB78; --on-accent:#06120A; --accent-soft:#163522; --accent-ink:#A8EDC3;
  --red:#FF5C70; --red-soft:#3B151B;
  --amber:#F2B544; --amber-soft:#3A2B0E; --blue:#79AEF2; --blue-soft:#14253F; --hero:#132A1C;
  --night:#18211B; --night-2:#222D26; --night-ink:#EEF4EF; --night-muted:#9EAEA3; --ring-track:#2E3B33;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;margin:0;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--safe-area-inset-top,env(safe-area-inset-top,0px));z-index:30;background:var(--bg)}
h1,h2,h3,p{margin:0}
h1,h2,h3{letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;flex:none;fill:currentColor}
.ic.sm{width:16px;height:16px}
.ic.lg{width:24px;height:24px}
.n{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}

main{max-width:600px;margin:0 auto;padding-block:12px 116px;
  padding-left:max(16px,var(--safe-area-inset-left,env(safe-area-inset-left,0px)));padding-right:max(16px,var(--safe-area-inset-right,env(safe-area-inset-right,0px)))}
.view{display:grid;gap:14px;animation:viewIn .35s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Page head */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
.phead h1{font-size:28px;font-weight:800}
.phead .sub{font-size:14px;color:var(--muted);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;font-size:13px;font-weight:600;padding:6px 12px;white-space:nowrap}
.pill.soft{background:var(--accent-soft);color:var(--accent-ink)}
.pill.line{border:1px solid var(--line);color:var(--muted)}
.pill.red{background:var(--red-soft);color:var(--red)}

.card{background:var(--surface);border-radius:var(--r-card);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:18px;font-weight:700}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 18px;font-weight:700;font-size:15px;background:var(--accent);color:var(--on-accent);transition:transform .15s var(--ease),opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.redb{background:var(--red);color:#fff}
.btn.sm{padding:8px 14px;font-size:14px}
.btn.block{width:100%}
.icon-btn{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;background:var(--sunk);transition:transform .15s var(--ease)}
.icon-btn:active{transform:scale(.92)}

/* Hero summary */
.hero{background:var(--night);color:var(--night-ink);border-radius:var(--r-card);padding:18px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{position:relative;width:120px;height:120px}
.ring svg{width:120px;height:120px;transform:rotate(-90deg)}
.ring .track{stroke:var(--ring-track)}
.ring .val{stroke:var(--accent);transition:stroke-dashoffset .8s var(--ease)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .mid b{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.03em}
.ring .mid span{font-size:12px;color:var(--night-muted)}
.next{display:grid;gap:10px;min-width:0}
.next .lbl{font-size:12px;color:var(--night-muted);font-weight:600}
.next h2{font-size:19px;font-weight:700;color:var(--night-ink)}
.macro-line{display:flex;gap:14px;font-size:12px;color:var(--night-muted);flex-wrap:wrap}
.macro-line b{display:block;font-family:var(--mono);font-size:15px;color:var(--night-ink);font-weight:600}
.hero .btn{justify-self:start}
.done-msg{display:flex;align-items:center;gap:8px;color:var(--accent);font-weight:700}

/* Quick tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border-radius:var(--r-card);padding:12px;box-shadow:var(--shadow);display:grid;gap:8px;min-width:0}
.tile .t-top{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.tile .t-val{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.tile .t-val small{font-size:12px;color:var(--muted);font-weight:500}
.tile .t-bar{height:4px;border-radius:99px;background:var(--sunk);overflow:hidden}
.tile .t-bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s var(--ease)}
.tile.over .t-bar i{background:var(--red)}
.tile.over .t-val{color:var(--red)}
.tile .t-act{display:grid;grid-template-columns:auto 1fr;gap:6px}
.tile .t-act button{height:36px;white-space:nowrap;border-radius:999px;background:var(--sunk);display:grid;place-items:center;font-weight:700;font-size:13px;transition:transform .15s var(--ease)}
.tile .t-act button.plus{background:var(--accent);color:var(--on-accent)}
.tile.cola .t-act button.plus{background:var(--red);color:#fff}
.tile .t-act button.minus{width:36px}
.tile .t-act button:active{transform:scale(.94)}
.drop-ic{color:#2F8FD8}
.cola-ic{color:var(--red)}
.walk-ic{color:var(--accent)}

/* Meal timeline */
.tl{display:grid}
.mrow{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:10px;padding:10px 0;position:relative}
.mrow + .mrow{border-top:1px solid var(--line)}
.mrow .time{font-family:var(--mono);font-size:13px;color:var(--muted)}
.mrow .open{text-align:left;display:grid;gap:1px;min-width:0;padding:4px 0}
.mrow .open .w{font-size:12px;font-weight:600;color:var(--muted)}
.mrow .open .nm{font-size:15px;font-weight:600;line-height:1.3}
.mrow .open .kc{font-family:var(--mono);font-size:12px;color:var(--muted)}
.mrow.is-next .time{color:var(--accent);font-weight:600}
.mrow.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.tick{width:36px;height:36px;border-radius:999px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;transition:background .2s,border-color .2s,transform .2s var(--ease)}

/* Week strip */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}

.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.totals div{display:grid;gap:2px}

.act-card:active{transform:scale(.98)}

/* Swaps */
.swaps{display:grid;gap:12px}
.swap{display:grid;gap:2px}

.swap span{font-size:14px;color:var(--muted)}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:50}
.sheet-bg{position:absolute;inset:0;background:rgba(8,12,9,.45);opacity:0;transition:opacity .25s}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;max-height:88dvh;overflow:auto;overscroll-behavior:contain;
  background:var(--surface);border-radius:24px 24px 0 0;padding-block:8px calc(24px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));
  padding-left:max(18px,var(--safe-area-inset-left,env(safe-area-inset-left,0px)));padding-right:max(18px,var(--safe-area-inset-right,env(safe-area-inset-right,0px)));
  transform:translateY(100%);transition:transform .35s var(--ease)}
.sheet.open .sheet-bg{opacity:1}

.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}

.nut{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:6px;margin-bottom:16px}

.ingr{display:grid;margin-bottom:14px}
.ingr div{display:grid;grid-template-columns:1fr auto;gap:12px;padding:9px 0;font-size:15px}
.ingr div + div{border-top:1px solid var(--line)}

.ingr .g{display:block;font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}

.sheet-actions{display:grid;gap:8px}

/* Shopping */
.shop-group + .shop-group{margin-top:14px}
.shop-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;font-size:15px;cursor:pointer}
.shop-item + .shop-item{border-top:1px solid var(--line)}

.shop-item input:checked{background:var(--accent);border-color:var(--accent)}
.shop-item input:checked::after{content:"";width:6px;height:11px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.shop-item.done span{text-decoration:line-through;color:var(--muted)}
.shop-item b{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--muted)}

/* Hands */
.hands{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hand{background:var(--sunk);border-radius:16px;padding:14px;display:grid;gap:4px}

.weeks{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}

input[type=number],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--sunk);border:1px solid transparent;border-radius:var(--r-input);padding:11px 13px;min-width:0;width:100%}

.ck b{display:block;font-size:15px}
.ck span{font-size:13px;color:var(--muted)}

details.settings summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:700;font-size:16px}

details.settings[open] .car{transform:rotate(90deg)}
.car{transition:transform .2s var(--ease)}

.switch{appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:none;margin:0;cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:999px;background:var(--surface);transition:transform .25s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.2)}

  padding-left:max(16px,var(--safe-area-inset-left,env(safe-area-inset-left,0px)));padding-right:max(16px,var(--safe-area-inset-right,env(safe-area-inset-right,0px)))}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));padding-left:max(6px,var(--safe-area-inset-left,env(safe-area-inset-left,0px)));padding-right:max(6px,var(--safe-area-inset-right,env(safe-area-inset-right,0px)))}

.toast{position:fixed;left:50%;bottom:calc(150px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));z-index:60;transform:translate(-50%,20px);opacity:0;background:var(--night);color:var(--night-ink);
  padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;transition:transform .3s var(--ease),opacity .3s;pointer-events:none;white-space:nowrap}

.sugs-h.big .sug{padding:12px 16px;font-size:14px}

/* Dodavanje hrane */
.srch{display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:var(--r-input);padding:0 12px;color:var(--muted);margin-bottom:12px}
.srch input{background:transparent;border:0;padding:12px 0}
.srch input:focus{border:0}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qi{display:grid;gap:2px;text-align:left;background:var(--sunk);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:600;transition:transform .15s var(--ease)}
.qi:active{transform:scale(.97)}
.qi b{font-size:12px;color:var(--muted);font-weight:500}
.mono-ta{width:100%;font-family:var(--mono);font-size:12px;background:var(--sunk);color:var(--ink);border:0;border-radius:var(--r-input);padding:12px}
.note{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:13px;color:var(--muted);align-items:start}
.toast{bottom:calc(150px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)))}
.misslist{display:grid;gap:6px;margin-top:10px}.misslist div{background:var(--sunk);border-radius:12px;padding:8px 12px;font-size:14px}
.hero{box-shadow:var(--shadow)}
.toast{box-shadow:0 6px 24px rgba(0,0,0,.18);border:1px solid var(--line)}
.avatar{border:1px solid var(--line)}
.theme-seg{margin-top:4px}

/* ---- v4 polish ---- */
.tick{width:44px;height:44px}
.icon-btn{width:44px;height:44px}
.tile .t-act button{height:44px}
.tile .t-act button.minus{width:44px}
.btn.sm{padding:11px 15px;min-height:44px}
.seg5 button{min-height:44px}
.act{min-height:40px;padding:10px 14px}
.chip-t{min-height:44px}
.seg button{min-height:40px}
.day{min-height:52px}
.ex summary{min-height:56px}
.qi{min-height:56px}
.mrow .open{min-height:48px}
button,.chip-t,.qi,.sug,.day,.act,.act-card,.mrow .open,.ex summary,.shop-item{transition:transform .14s var(--ease),background-color .2s,opacity .2s}
button:active,.chip-t:active,.qi:active,.sug:active,.day:active,.act:active,.act-card:active,.mrow .open:active,.ex summary:active,.shop-item:active{transform:scale(.97)}
.tab:active .ic{transform:scale(.88)}
.tab .ic{transition:transform .14s var(--ease)}
body.kb nav.tabs{display:none}
body.kb .composer{bottom:0}
.tabs .tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile .t-val{overflow-wrap:anywhere}

/* Toast sa poništavanjem */
.toast{pointer-events:auto;gap:10px;padding:8px 8px 8px 16px;max-width:calc(100vw - 32px)}
.toast .undo{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700;min-height:36px}
.toast:not(.has-undo){padding:10px 16px}

/* Prevlačenje obroka */
.sw{position:relative;overflow:hidden;border-radius:14px}
.sw + .sw{border-top:1px solid var(--line)}
.sw .sw-bg{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:13px;font-weight:700}
.sw .sw-bg span{display:flex;align-items:center;gap:6px;opacity:0;transition:opacity .15s}
.sw .sw-l{color:var(--accent)}
.sw .sw-r{color:var(--muted)}
.sw.go-r .sw-bg{background:var(--accent-soft)}.sw.go-r .sw-l{opacity:1}
.sw.go-l .sw-bg{background:var(--sunk)}.sw.go-l .sw-r{opacity:1}
.sw .mrow{background:var(--surface);position:relative;touch-action:pan-y;padding-inline:2px}
.sw .mrow + .mrow{border-top:0}
.swipe-hint{font-size:12px;color:var(--muted);margin-top:8px}

/* Jutarnji check-in */
.checkin .ci-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 0}
.checkin .ci-row + .ci-row{border-top:1px solid var(--line)}
.checkin .ci-row > span{font-weight:600;font-size:15px}
.checkin input[type=number]{width:120px;text-align:center}

/* Nedeljni izveštaj */
.report{background:var(--night);color:var(--night-ink);border-radius:var(--r-card);padding:16px;display:grid;gap:10px;box-shadow:var(--shadow)}
.report .lbl{font-size:13px;font-weight:600;color:var(--accent)}
.report h2{font-size:19px}
.report .rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.report .rgrid div{background:var(--night-2);border-radius:14px;padding:10px 8px;display:grid;gap:2px;text-align:center}
.report .rgrid b{font-family:var(--mono);font-size:17px}
.report .rgrid span{font-size:12px;color:var(--night-muted)}
.report p{font-size:14px;color:var(--night-muted)}

/* Kalendar doslednosti */
.heat-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.heat-head span{font-size:12px;color:var(--muted);text-align:center}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat i{aspect-ratio:1;border-radius:8px;background:var(--sunk);display:block;position:relative}
.heat i.l1{background:color-mix(in srgb,var(--accent) 25%,var(--sunk))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 50%,var(--sunk))}
.heat i.l3{background:color-mix(in srgb,var(--accent) 75%,var(--sunk))}
.heat i.l4{background:var(--accent)}
.heat i.fut{background:transparent;border:1px dashed var(--line)}
.heat i.today{outline:2px solid var(--ink);outline-offset:1px}
.heat-leg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:10px;justify-content:flex-end}
.heat-leg i{width:14px;height:14px;border-radius:4px;display:inline-block}
.streak-big{display:flex;align-items:baseline;gap:8px}
.streak-big b{font-family:var(--mono);font-size:32px;font-weight:600;letter-spacing:-.03em}
.streak-big span{color:var(--muted);font-size:14px}

/* Uvidi */
.insights{display:grid;gap:10px}
.ins{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--sunk);border-radius:16px;padding:12px 14px}
.ins .ic{color:var(--accent);margin-top:2px}
.ins b{display:block;font-size:15px}
.ins span{font-size:13px;color:var(--muted)}

/* Makroi po danu */
.mstack{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end}
.mst{display:grid;gap:6px;justify-items:center}
.mst-col{position:relative;width:100%;max-width:30px;height:130px;display:flex;flex-direction:column-reverse;border-radius:8px;overflow:hidden;background:var(--sunk)}
.mst-col i{display:block;width:100%}
.mst-col .p{background:var(--accent)}
.mst-col .c{background:#E0A43A}
.mst-col .f{background:var(--red);opacity:.85}
.mst-col s{position:absolute;left:0;right:0;height:2px;background:var(--ink);opacity:.5}
.mst span{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Prekretnice */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{border-radius:16px;padding:12px 6px;background:var(--sunk);display:grid;justify-items:center;gap:4px;text-align:center}
.badge .ic{width:26px;height:26px;color:var(--muted)}
.badge b{font-size:13px;line-height:1.2}
.badge span{font-size:12px;color:var(--muted)}
.badge.got{background:var(--accent-soft)}
.badge.got .ic{color:var(--accent)}
.badge:not(.got){opacity:.6}

/* Omiljeno / ne sviđa mi se */
.prefs{display:flex;gap:8px;margin-bottom:14px}
.prefs button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;background:var(--sunk);padding:10px;font-weight:600;font-size:14px;min-height:44px}
.prefs button.on.fav{background:var(--red-soft);color:var(--red)}
.prefs button.on.dis{background:var(--ink);color:var(--bg)}
.fav-dot{color:var(--red);display:inline-flex;vertical-align:-2px;margin-left:4px}
.fav-dot .ic{width:14px;height:14px}

/* Režim kuvanja */
.cook{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;
  padding-top:calc(12px + var(--safe-area-inset-top,env(safe-area-inset-top,0px)));padding-bottom:calc(16px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));
  padding-left:max(18px,var(--safe-area-inset-left,env(safe-area-inset-left,0px)));padding-right:max(18px,var(--safe-area-inset-right,env(safe-area-inset-right,0px)))}
.cook-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.cook-top .small{font-weight:600;display:flex;align-items:center;gap:6px}
.cook-prog{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin:12px 0}
.cook-prog i{display:block;height:100%;background:var(--accent);transition:width .3s var(--ease)}
.cook-body{overflow:auto;display:grid;align-content:start;gap:16px;padding:8px 0}
.cook-body h2{font-size:24px;font-weight:800}
.cook-step{font-size:24px;line-height:1.4;font-weight:500}
.cook-ing{display:grid}
.cook-ing label{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;font-size:18px}
.cook-ing label + label{border-top:1px solid var(--line)}
.cook-ing b{font-weight:600;color:var(--muted);font-size:15px}
.timer{display:grid;justify-items:center;gap:10px;background:var(--sunk);border-radius:20px;padding:18px}
.timer b{font-family:var(--mono);font-size:44px;font-weight:600;letter-spacing:-.03em}
.cook-nav{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.cook-nav .btn{min-height:54px;font-size:17px}
.share-row{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 14px}


/* Uvećan sistemski font: pločice jedna ispod druge */
body.bigtext .tiles{grid-template-columns:1fr!important}
body.bigtext .tile{grid-template-columns:1fr auto;grid-template-areas:"top act" "val act" "bar bar";align-items:center}
body.bigtext .tile .t-top{grid-area:top}
body.bigtext .tile .t-val{grid-area:val}
body.bigtext .tile .t-bar{grid-area:bar}
body.bigtext .tile .t-act{grid-area:act;grid-template-columns:44px auto}
body.bigtext .tile .t-act button.plus{padding:0 14px}
body.bigtext .next-card .row .btn{flex:1 1 auto}
body.bigtext .hero{grid-template-columns:1fr;justify-items:start}
body.bigtext .tabs .tab span{font-size:11px}
@media (max-width:400px){.nums b{font-size:16px}.quick{grid-template-columns:1fr}.seg button{font-size:13px;padding:9px 4px}}

/* ================= v5: topliji izgled ================= */
:root{--flame:#E2561B;--plate-empty:rgba(255,255,255,.85);--slice-empty:#CBE3D2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--flame:#FF8A50;--plate-empty:rgba(255,255,255,.08);--slice-empty:rgba(255,255,255,.1)}}
:root[data-theme="dark"]{--flame:#FF8A50;--plate-empty:rgba(255,255,255,.08);--slice-empty:rgba(255,255,255,.1)}
body{font-family:var(--font)}
h1,h2,h3,.wiz-h,.big,.n,.nc-name{font-family:var(--display)}
h1{font-weight:800}
.phead h1{font-size:30px}
.card h2,.sec-title h2{font-size:19px;font-weight:700}
.phead.home{align-items:center}
.hello{font-size:15px;font-weight:600;color:var(--muted)}
.status{display:flex;gap:8px;flex-wrap:wrap}
.st-chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 14px 6px 8px;min-height:42px;background:var(--surface);box-shadow:var(--shadow);font-size:14px}
.st-chip .ic{width:24px;height:24px}
.st-chip b{font-family:var(--display);font-weight:700}
.st-chip small{color:var(--muted);font-size:12px;font-weight:600}
.st-chip.fire .ic{color:var(--flame)}
.st-chip.lvl .ic{color:var(--accent)}
.st-chip.shield .ic{color:var(--blue)}

.hero2{background:var(--hero);border-radius:var(--r-card);padding:18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.plate{position:relative;width:132px;height:132px;flex:none}
.plate svg{width:132px;height:132px;display:block}
.plate .pc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.plate .pc b{font-size:22px;font-weight:800;line-height:1}
.plate .pc span{font-size:12px;color:var(--muted);font-weight:600}
.big{font-size:36px;font-weight:800;line-height:1;letter-spacing:-.025em}
.big small{font-family:var(--font);font-size:15px;font-weight:600;color:var(--muted);margin-left:5px;letter-spacing:0}
.hero2 .sub{font-size:13px;color:var(--muted);margin-top:4px;font-weight:600}
.mcaps{display:grid;gap:7px;margin-top:12px}
.mcap{display:grid;grid-template-columns:58px 1fr auto;gap:8px;align-items:center;font-size:12px;font-weight:700}
.mcap .tr{height:8px;border-radius:99px;background:var(--plate-empty);overflow:hidden}
.mcap .tr i{display:block;height:100%;border-radius:99px;transition:width .6s var(--ease)}
.mcap .v{font-family:var(--display);font-size:12px;color:var(--muted);font-weight:600}

.av-food{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;flex:none}
.av-food .ic{width:26px;height:26px}
.av-food.lg{width:60px;height:60px}
.av-food.lg .ic{width:34px;height:34px}
.t-d{background:var(--amber-soft);color:var(--amber)}
.t-s{background:var(--red-soft);color:var(--red)}
.t-l{background:var(--accent-soft);color:var(--accent)}
.t-v{background:var(--blue-soft);color:var(--blue)}
.t-x{background:var(--sunk);color:var(--muted)}

.next2{display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:center}
.next2 .nx-body{display:grid;gap:2px;min-width:0}
.next2 .lbl{font-size:13px;font-weight:700;color:var(--accent)}
.next2 .nc-name{font-size:20px;font-weight:700;text-align:left;line-height:1.2;display:block;letter-spacing:-.01em}
.next2 .kc{font-size:13px;color:var(--muted)}
.next2 .nx-btns{grid-column:1/-1;flex-wrap:wrap;gap:8px}

.mrow{grid-template-columns:44px 1fr auto}
.mrow .w{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mrow .nm{font-weight:600}
.mrow .kc,.mrow .w{font-family:var(--font)}
.mrow.done .av-food{opacity:.5}
.newtag{font-size:12px;font-weight:700;color:var(--amber);background:var(--amber-soft);border-radius:999px;padding:0 8px;line-height:20px}
.mrow.extra{grid-template-columns:44px 1fr auto}

.tile{box-shadow:none;border-radius:22px}
.tile.water{background:var(--blue-soft)}
.tile.cola{background:var(--red-soft)}
.tile.walk{background:var(--accent-soft)}
.tile .t-top{color:var(--ink);font-weight:700;font-size:13px;gap:8px}
.tile .t-ic .ic{width:22px;height:22px}
.tile.cola .t-ic{color:var(--red)}
.tile.walk .t-ic{color:var(--accent)}
.tile .t-bar{background:var(--plate-empty)}
.tile.water .t-bar i{background:var(--blue)}
.tile .t-act button{background:var(--plate-empty)}
.tile.water .t-act button.plus{background:var(--blue);color:var(--surface-solid)}
.tile.cola .t-act button.plus{background:var(--red);color:var(--surface-solid)}
.tile .t-val{font-family:var(--display);font-weight:700}
.tile .t-val small{font-family:var(--font)}
.glass{width:18px;height:24px;border:2px solid var(--blue);border-top-width:0;border-radius:0 0 7px 7px;position:relative;overflow:hidden;display:inline-block;flex:none}
.glass i{position:absolute;left:0;right:0;bottom:0;background:var(--blue);opacity:.75;transition:height .5s var(--ease)}

.quests .q{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 0}
.quests .q + .q{border-top:1px dashed var(--line)}
.qi2{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--sunk);color:var(--muted);flex:none}
.qi2 .ic{width:24px;height:24px}
.q.done .qi2{background:var(--accent);color:var(--on-accent);animation:pop .35s var(--ease)}
.q.done .qi2 .ic{width:18px;height:18px}
.qt{min-width:0;display:grid;gap:1px}
.qt b{font-size:15px;font-weight:600}
.qt small{font-size:12px;color:var(--muted)}
.q.done .qt b{color:var(--muted)}
.qp{font-family:var(--display);font-size:14px;font-weight:700;color:var(--muted)}
.qclaim{border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:13px;padding:0 14px;min-height:40px}
.qundo{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.qbonus{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:8px 0 2px;font-weight:600}
.qbonus .ic{width:22px;height:22px;color:var(--amber)}
.quizrow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;margin-top:12px;padding:10px 14px 10px 10px;border-radius:18px;background:var(--blue-soft);min-height:60px}
.quizrow .qi2{background:var(--surface);color:var(--blue)}
.quizrow.done .qi2{color:var(--accent)}
.quizrow > .ic{color:var(--muted)}
.qopts{display:grid;gap:8px;margin:4px 0 14px}
.qopt{min-height:54px;border-radius:16px;background:var(--sunk);text-align:left;padding:12px 16px;font-size:16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px}
.qopt:disabled{cursor:default}
.qopt.ok{background:var(--accent-soft);color:var(--accent-ink)}
.qopt.bad{background:var(--red-soft);color:var(--red)}
.tip.soft-blue{background:var(--blue-soft)}
.tip .ic{width:24px;height:24px}

.segtabs{position:sticky;top:calc(var(--safe-area-inset-top,env(safe-area-inset-top,0px)) + 8px);z-index:6;display:flex;gap:4px;padding:4px;background:var(--sunk);border-radius:999px;box-shadow:0 0 0 8px var(--bg)}
.segtabs button{flex:1;min-height:42px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;padding:0 10px}
.segtabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.segtabs.scroll{overflow-x:auto;scrollbar-width:none}
.segtabs.scroll::-webkit-scrollbar{display:none}
.segtabs.scroll button{flex:none}
.segbody{display:grid;gap:14px}
.seg-in{animation:viewIn .3s var(--ease) both}

.streak-top{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.flame{width:56px;height:56px;border-radius:999px;background:color-mix(in srgb,var(--flame) 15%,var(--surface));color:var(--flame);display:grid;place-items:center;flex:none}
.flame .ic{width:34px;height:34px}
.shields{display:grid;grid-template-columns:auto auto 1fr;gap:8px;align-items:center;margin-bottom:14px;background:var(--sunk);border-radius:16px;padding:10px 12px}
.sh{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;color:var(--line);background:var(--surface)}
.sh.on{color:var(--blue);background:var(--blue-soft)}
.sh .ic{width:22px;height:22px}
.heat i.frz{background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.heat i.frz .ic{width:60%;height:60%}

.hb + .hb{margin-top:16px}
.hb-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hb-h > span:first-child{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.hb-h .ic{width:22px;height:22px}
.hb-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.hb-bars > div{display:grid;grid-template-rows:56px auto;justify-items:center;gap:4px}
.hb-bars i{align-self:end;width:100%;max-width:28px;border-radius:8px;min-height:4px;opacity:.45}
.hb-bars i.full{opacity:1}
.hb-bars span{font-size:12px;color:var(--muted)}
.hb-bars span.cur{color:var(--accent);font-weight:700}

.plant-hero{background:var(--hero);border-radius:var(--r-card);padding:22px 18px;display:grid;justify-items:center;text-align:center;gap:8px}
.plant-hero h2{font-size:26px;font-weight:800}
.plant-pot{width:120px;height:120px;border-radius:999px;background:var(--surface);display:grid;place-items:center;color:var(--accent);box-shadow:var(--shadow)}
.plant-pot .ic{width:72px;height:72px;transform-origin:50% 92%;animation:sway 4.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.lvl-bar{width:100%;height:12px;border-radius:99px;background:var(--surface);overflow:hidden}
.lvl-bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .8s var(--ease)}
.earn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.earn div{background:var(--sunk);border-radius:14px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600}
.earn b{color:var(--accent)}
.badge .bdg{display:grid;place-items:center}
.badge .bdg .ic{width:30px;height:30px}

.kprog{display:flex;gap:12px;align-items:center;background:var(--hero);border-radius:20px;padding:14px}
.kp-ic{width:44px;height:44px;border-radius:999px;background:var(--surface);display:grid;place-items:center;color:var(--accent);flex:none}
.kp-ic .ic{width:26px;height:26px}
.fchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.fchips::-webkit-scrollbar{display:none}
.fchips .chip-t{flex:none;background:var(--surface);box-shadow:var(--shadow)}
.fchips .chip-t.on{background:var(--ink);color:var(--bg)}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kcard{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:14px;display:grid;gap:8px;text-align:left;align-content:start;position:relative;min-width:0}
.kcard b{font-size:15px;line-height:1.25;font-weight:700}
.kcard .km{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.kcard .km .ic{width:12px;height:12px;color:var(--red)}
.kcard .tried{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:999px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.kcard .tried .ic{width:13px;height:13px}
.empty{display:grid;justify-items:center;text-align:center;gap:6px;padding:28px 16px;color:var(--muted)}
.empty .ic{width:44px;height:44px;color:var(--accent)}
.empty b{color:var(--ink);font-size:16px}
.walkhero{grid-template-columns:auto 1fr}
.act-card .bubble .ic{width:24px;height:24px}
.pill .ic{width:16px;height:16px}

.lvlup{position:fixed;inset:0;z-index:85;display:grid;place-items:center;background:rgba(8,12,9,.5);padding:24px;animation:fadeIn .25s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.lvlup .box{background:var(--surface);border-radius:28px;padding:28px 22px 22px;max-width:340px;width:100%;display:grid;justify-items:center;text-align:center;gap:10px;animation:popIn .5s var(--ease) both}
.lvlup .plant-pot{background:var(--hero);box-shadow:none}
.lvlup h2{font-size:24px;font-weight:800}
@keyframes popIn{from{transform:scale(.85) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:95}
@media (max-width:380px){.hero2{grid-template-columns:1fr;justify-items:center;text-align:center}.hero2 > div{width:100%}.mcap{text-align:left}.kgrid{grid-template-columns:1fr 1fr}.earn{grid-template-columns:1fr}}
body.bigtext .hero2{grid-template-columns:1fr;justify-items:center}
body.bigtext .hero2 > div{width:100%}
body.bigtext .kgrid{grid-template-columns:1fr}
body.bigtext .status .st-chip small{display:none}
@media (prefers-reduced-motion:reduce){.plant-pot .ic{animation:none}}
/* ---- v6 ---- */
.toast{white-space:normal;max-width:min(440px,calc(100vw - 32px));width:max-content;line-height:1.35;border-radius:20px;text-align:left}
.toast > span{min-width:0;overflow-wrap:anywhere}
.toast .undo{flex:none}
.sheet-head > div{min-width:0}
.sheet-head h2{overflow-wrap:anywhere;line-height:1.2}
.sheet-head .icon-btn{flex:none}
.sh-l{display:flex;gap:12px;align-items:flex-start;min-width:0}
.sh-l > div{min-width:0}
.sheet-panel{max-height:min(88dvh,calc(100dvh - var(--safe-area-inset-top,env(safe-area-inset-top,0px)) - 16px))}
.lvlup .box{max-height:calc(100dvh - 48px);overflow:auto}
.icon-btn.sm{width:34px;height:34px}
.icon-btn.lg{width:56px;height:56px}
.note{background:var(--sunk);border-radius:14px;padding:10px 12px;margin:10px 0;color:var(--ink)}
.note .ic{color:var(--accent);margin-top:1px}
.note.warn{background:var(--amber-soft,var(--sunk))}.note.warn .ic{color:var(--amber)}
.note.ok .ic{color:var(--accent)}
.note.adjn{margin:0 0 10px}
.why{display:flex;gap:10px;align-items:center;background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.why .ic{color:var(--red);flex:none}
/* tempo */
.pacec-list{display:grid;gap:8px}
.pacec{display:grid;gap:4px;text-align:left;background:var(--sunk);border-radius:18px;padding:14px;border:2px solid transparent;transition:border-color .2s,background .2s}
.pacec.on{border-color:var(--accent);background:var(--surface);box-shadow:var(--shadow)}
.pc-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pc-top b{font-size:16px;color:var(--ink)}
.pc-wk{font-weight:700;color:var(--accent);font-size:15px}
.pc-dt{font-size:14px;font-weight:600;color:var(--ink)}
.pc-meta{font-size:12.5px;color:var(--muted);font-weight:500}
/* slobodan unos */
.cu-srch{margin-bottom:6px}
.cu-help{margin-bottom:12px}
.cu-chips .chip-t{font-size:13px;padding:8px 12px}
.cu-chips .muted{font-weight:500;font-size:12px}
.cu-row{display:grid;grid-template-columns:minmax(0,1fr) auto 40px;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cu-n{display:grid;gap:2px;min-width:0}
.cu-n b{font-size:15px;overflow-wrap:anywhere}
.cu-n span{font-size:12px;color:var(--muted)}
.cu-alt{justify-self:start;font-size:12px;font-weight:700;color:var(--accent);padding:4px 0}
.cu-q{display:flex;align-items:center;gap:4px}
.cu-q b{min-width:28px;text-align:center;font-size:15px}
.cu-k{font-weight:700;text-align:right;font-size:14px}
.cu-alts{padding:8px 0 4px}
.cu-alts .chip-t{font-size:13px;padding:7px 11px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.cu-man{display:grid;grid-template-columns:1.6fr 1fr;gap:10px;margin-top:10px}
.cu-tot{display:grid;grid-template-columns:1.3fr repeat(3,1fr);gap:6px;margin-top:14px}
.cu-tot div{background:var(--sunk);border-radius:14px;padding:10px 6px;text-align:center;display:grid}
.cu-tot div:first-child{background:var(--night);color:var(--night-ink)}
.cu-tot b{font-size:17px}.cu-tot span{font-size:11px;opacity:.75}
.cu-cmp{margin-top:10px}.cu-cmp.over{color:var(--red);font-weight:600}
.btn[disabled]{opacity:.45}
/* fotografije */
.phblk{position:relative;margin:0 0 12px;border-radius:18px;overflow:hidden}
.phblk img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.phbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:1.5px dashed var(--line);border-radius:16px;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer}
.phblk.has .phbtn{position:absolute;left:10px;bottom:10px;border:0;background:rgba(0,0,0,.55);color:#fff;padding:0 14px;min-height:40px;border-radius:999px}
.phdel{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.av-food.ph{overflow:hidden;background:var(--sunk)}
.av-food.ph img{width:100%;height:100%;object-fit:cover}
/* recepti */
.rmeta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.rmeta span{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600}
.rmeta .ic{width:15px;height:15px;color:var(--accent)}
.steps{list-style:none;counter-reset:st;display:grid;gap:10px;margin:0 0 6px;padding:0}
.steps li{counter-increment:st;display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:15px;line-height:1.45}
.steps li::before{content:counter(st);width:28px;height:28px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px;font-family:var(--mono)}
.seg.mini{margin:0 0 10px;max-width:280px}
.seg.mini button{padding:7px 6px;font-size:13px}
.cook-ing .shop-item{padding:12px 0}
/* trening */
.actc .sec-title h2{display:flex;align-items:center;gap:6px;font-size:17px}
.actc .ic{color:var(--red)}
.actc.compact{padding-block:14px}
.wocard .pill .ic{margin-right:2px}
.wostrip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wo-th{display:grid;gap:4px;justify-items:center;text-align:center;background:var(--sunk);border-radius:14px;padding:6px 4px 8px;min-width:0}
.wo-th canvas{width:100%;height:64px;display:block}
.wo-th span{font-size:11px;font-weight:600;line-height:1.2;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.progs{display:grid;gap:8px}
.progc{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--sunk);border-radius:16px;padding:10px 12px}
.pg-ic{width:44px;height:44px;border-radius:999px;background:var(--surface);display:grid;place-items:center;color:var(--accent)}
.pg-t{display:grid;gap:2px;min-width:0}.pg-t b{font-size:15px}.pg-t small{font-size:12px;color:var(--muted)}
.pg-done{width:26px;height:26px;border-radius:999px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.excard{display:grid;gap:4px;text-align:left;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:10px 12px 12px;min-width:0;align-content:start}
.excard canvas{width:100%;height:96px;display:block;background:var(--sunk);border-radius:14px;margin-bottom:4px}
.excard b{font-size:14px;line-height:1.25}
.excard .km{font-size:12px;color:var(--muted)}
.excard.off{opacity:.55}
.exflag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--muted)}
.exflag.warn{color:var(--amber)}.exflag .ic{width:13px;height:13px}
.exbig{background:var(--sunk);border-radius:20px;margin-bottom:12px}
.exbig canvas{width:100%;height:200px;display:block}
.exlist{display:grid;gap:8px}
.exrow{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--sunk);border-radius:14px;padding:6px 10px 6px 6px}
.exrow canvas{width:72px;height:54px;display:block;background:var(--surface);border-radius:10px}
.exrow span{display:grid;gap:2px;min-width:0}.exrow b{font-size:14px}.exrow small{font-size:12px;color:var(--muted)}
.wklist{display:grid;margin-top:12px}
.wklist div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:14px;border-top:1px solid var(--line)}
.wklist div span{color:var(--muted)}.wklist div.cur b{color:var(--accent)}
.wo{position:fixed;inset:0;z-index:72;background:var(--bg);display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;
  padding-top:calc(12px + var(--safe-area-inset-top,env(safe-area-inset-top,0px)));padding-bottom:calc(16px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));padding-inline:18px}
.wo-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.wo-top .small{font-weight:700}
.wo-stage{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);min-height:160px;display:grid}
.wo-stage canvas{width:100%;height:100%;min-height:160px;display:block}
.wo-stage.rest,.wo-stage.next,.wo-stage.ready{opacity:.75}
.wo-info{display:grid;justify-items:center;text-align:center;gap:6px;padding:12px 0 8px}
.wo-ph{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.wo-ph.rest,.wo-ph.next,.wo-ph.ready{color:var(--amber)}
.wo-info h2{font-size:24px;font-weight:800;line-height:1.15}
.wo-tm{position:relative;width:118px;height:118px;display:grid;place-items:center}
.wo-tm svg{position:absolute;inset:0;width:100%;height:100%}
.wo-tm b{font-family:var(--mono);font-size:30px;font-weight:700}
.wo-cues{list-style:none;padding:0;margin:0;display:grid;gap:3px;font-size:14px;color:var(--muted);max-width:420px}
.wo-nav{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.wo-nav .btn{min-height:56px;font-size:17px}
.wo-fin{grid-row:1/-1;display:grid;justify-items:center;align-content:center;gap:14px;text-align:center}
.wo-fin > .ic{width:64px;height:64px;color:var(--amber)}
.wo-fin h2{font-size:24px;font-weight:800}
@media (max-height:700px){.wo-tm{width:92px;height:92px}.wo-tm b{font-size:24px}.wo-info h2{font-size:20px}.wo-cues li:nth-child(n+3){display:none}}
@media (max-width:380px){.wostrip{grid-template-columns:repeat(2,1fr)}.cu-man{grid-template-columns:1fr}}
body.bigtext .exgrid{grid-template-columns:1fr}
body.bigtext .wostrip{grid-template-columns:repeat(2,1fr)}
/* ---- spisak za kupovinu ---- */
.sh-per{margin:0 -2px 12px}
.sh-days{display:grid;gap:6px;margin-bottom:12px}
.sh-wk{display:grid;grid-template-columns:52px repeat(7,1fr);gap:4px;align-items:center}
.sh-wk > span{font-size:12px;font-weight:700;color:var(--muted)}
.sh-day{display:grid;justify-items:center;gap:0;border-radius:12px;background:var(--sunk);padding:6px 0;min-height:44px}
.sh-day small{font-size:10.5px;color:var(--muted);font-weight:600}.sh-day b{font-size:14px}
.sh-day.on{background:var(--accent);color:var(--on-accent)}.sh-day.on small{color:inherit;opacity:.85}
.sh-day[disabled]{opacity:.35}
.sh-prog{margin:4px 0 12px}
.sh-pt{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:6px}
.sh-tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sh-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px}
.sh-row + .sh-row{border-top:1px solid var(--line)}
.sh-main,.sh-row.ed{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;padding:10px 0;min-height:52px;width:100%}
.sh-row.ed{grid-column:1/-1}
.sh-n{display:grid;gap:1px;min-width:0}.sh-n > span{font-size:15px;overflow-wrap:anywhere}.sh-n small{font-size:11.5px;color:var(--muted)}
.sh-main b,.sh-row.ed b{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.ck{width:26px;height:26px;border-radius:999px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;transition:background .2s,border-color .2s}
.ck .ic{width:14px;height:14px;opacity:0}.sh-row.done .ck .ic,.sh-row.ed.on .ck .ic{opacity:1}
.sh-row.done .ck,.sh-row.ed.on .ck{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sh-row.done .sh-n > span{text-decoration:line-through;color:var(--muted)}
.sh-row.ed:not(.on) .sh-n > span{color:var(--muted);text-decoration:line-through}
.sh-x{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.sh-row.skip{grid-template-columns:minmax(0,1fr) auto auto;padding:8px 0}
.sh-row.skip .btn{padding:8px 12px}
.sh-addrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
.sh-more{margin-top:14px;background:var(--sunk);border-radius:16px;padding:4px 14px}
.sh-more summary{list-style:none;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;padding:10px 0;cursor:pointer}
.sh-more summary::-webkit-details-marker{display:none}
.sh-more summary .ic{transition:transform .2s}.sh-more[open] summary .ic{transform:rotate(90deg)}
.sh-more .sh-row + .sh-row{border-color:var(--surface)}
/* ================= v7: stakleni izgled ================= */
:root{
  --bg:#EAF4EE; --surface:rgba(255,255,255,.64); --surface-solid:#FFFFFF; --sunk:rgba(255,255,255,.55); --line:rgba(28,70,48,.10);
  --glass-brd:rgba(255,255,255,.85); --glass-bar:rgba(255,255,255,.62); --coral:#EE7D62; --coral-soft:#FDE3DA;
  --hero:linear-gradient(135deg,rgba(206,238,220,.92) 0%,rgba(255,236,226,.88) 100%);
  --shadow:0 12px 32px -18px rgba(30,74,52,.35),0 1px 2px rgba(30,74,52,.05);
  --night:rgba(255,255,255,.92); --r-card:26px;
  --bg-grad:radial-gradient(90% 55% at 0% 0%,#C9EBD8 0%,rgba(201,235,216,0) 70%),radial-gradient(80% 50% at 100% 100%,#FDD3C2 0%,rgba(253,211,194,0) 70%),radial-gradient(60% 40% at 100% 20%,#E2F1E8 0%,rgba(226,241,232,0) 70%),linear-gradient(170deg,#E4F3EA 0%,#F3F1EA 55%,#FBE6DC 100%);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1410; --surface:rgba(255,255,255,.065); --surface-solid:#16201B; --sunk:rgba(255,255,255,.055); --line:rgba(255,255,255,.09);
  --glass-brd:rgba(255,255,255,.09); --glass-bar:rgba(16,26,21,.66); --coral:#FF9478; --coral-soft:#3A1E17;
  --hero:linear-gradient(135deg,rgba(59,203,120,.18) 0%,rgba(255,148,120,.12) 100%);
  --shadow:0 12px 32px -18px rgba(0,0,0,.6); --night:rgba(28,40,33,.94);
  --bg-grad:radial-gradient(90% 55% at 0% 0%,rgba(46,170,108,.28) 0%,rgba(46,170,108,0) 70%),radial-gradient(80% 50% at 100% 100%,rgba(240,120,90,.20) 0%,rgba(240,120,90,0) 70%),linear-gradient(170deg,#0B1712 0%,#0C1210 55%,#17110F 100%)}}
:root[data-theme="dark"]{
  --bg:#0A1410; --surface:rgba(255,255,255,.065); --surface-solid:#16201B; --sunk:rgba(255,255,255,.055); --line:rgba(255,255,255,.09);
  --glass-brd:rgba(255,255,255,.09); --glass-bar:rgba(16,26,21,.66); --coral:#FF9478; --coral-soft:#3A1E17;
  --hero:linear-gradient(135deg,rgba(59,203,120,.18) 0%,rgba(255,148,120,.12) 100%);
  --shadow:0 12px 32px -18px rgba(0,0,0,.6); --night:rgba(28,40,33,.94);
  --bg-grad:radial-gradient(90% 55% at 0% 0%,rgba(46,170,108,.28) 0%,rgba(46,170,108,0) 70%),radial-gradient(80% 50% at 100% 100%,rgba(240,120,90,.20) 0%,rgba(240,120,90,0) 70%),linear-gradient(170deg,#0B1712 0%,#0C1210 55%,#17110F 100%)}
html{background:var(--bg)}
body{background:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bg-grad);pointer-events:none}
/* staklene površine */
.card,.act-card,.why,.st-chip,.excard,.pacec.on,.progc,.wo-stage,.tile2,.mtn-hero,.hero2,.plant-hero,.kprog{border:1px solid var(--glass-brd)}
.card,.act-card,.excard{box-shadow:var(--shadow)}
.hero2,.mtn-hero{background:var(--hero);box-shadow:var(--shadow)}
nav.tabs{background:var(--glass-bar);border-top:1px solid var(--glass-brd);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
.tab .bg{background:var(--accent);opacity:0}
.tab.on .bg{opacity:.14}
.sheet-panel{background:var(--glass-bar);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);border:1px solid var(--glass-brd);border-bottom:0}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.sheet-panel{background:var(--surface-solid)}nav.tabs{background:var(--surface-solid)}.segtabs{background:var(--surface-solid)}}
.sheet-bg{background:rgba(10,24,18,.32)}
.segtabs{background:var(--glass-bar);border:1px solid var(--glass-brd);box-shadow:0 8px 24px -16px rgba(30,74,52,.35);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}

.nxt-b{padding:14px 16px 16px;display:grid;gap:8px}
.nxt-lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.nxt-n{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.2;text-align:left}
.nxt-m{display:flex;flex-wrap:wrap;gap:6px}
.nxt-m span{background:var(--ghost);border-radius:10px;padding:4px 9px;font-size:12px;color:var(--muted);font-weight:600}
.nxt-m b{color:var(--ink);font-weight:700}
.nxt-act{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;margin-top:4px}
.nxt-act .btn{min-height:48px}
.rbtn{width:52px;height:52px;border-radius:16px;background:var(--ghost);display:grid;place-items:center;align-content:center;gap:0;color:var(--ink)}
.rbtn b{font-size:17px;line-height:1}.rbtn small{font-size:9.5px;font-weight:700;color:var(--muted);margin-top:2px}.rbtn .ic{width:18px;height:18px}
/* navike kao lista */
.habits{display:grid;gap:4px}
.hab{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0}
.hab + .hab{border-top:1px solid var(--track)}
.hab-ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center}
.hab-ic .ic{width:22px;height:22px}
.hab.water .hab-ic{background:color-mix(in oklab,var(--blue) 14%,transparent);color:var(--blue)}
.hab.cola .hab-ic{background:color-mix(in oklab,var(--coral) 16%,transparent);color:var(--coral)}
.hab.walk .hab-ic{background:color-mix(in oklab,var(--accent) 14%,transparent);color:var(--accent)}
.hab-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:13px;color:var(--muted)}
.hab-top > b{font-size:15px;color:var(--ink);font-weight:700}
.hab-top .n b{color:var(--ink);font-size:15px}
.hab-bar{height:6px;border-radius:99px;background:var(--track);margin-top:7px;overflow:hidden}
.hab-bar i{display:block;height:100%;border-radius:inherit;transition:width .5s var(--ease)}
.hab.water .hab-bar i{background:var(--blue)}.hab.cola .hab-bar i{background:var(--coral)}.hab.walk .hab-bar i{background:var(--accent)}
.hab.over .hab-bar i{background:var(--red)}
.hab-act{display:flex;gap:6px}
.rb{width:38px;height:38px;border-radius:12px;background:var(--ghost);display:grid;place-items:center;color:var(--ink)}
.rb.plus{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 14px -6px var(--accent)}
.hab.water .rb.plus{background:var(--blue)}.hab.cola .rb.plus{background:var(--coral)}
.rb .ic{width:17px;height:17px}
/* obroci danas */
.tl .mrow{background:transparent!important;border-radius:0;padding:10px 2px;margin:0}
.tl .sw + .sw .mrow,.tl .mrow + .mrow{border-top:1px solid var(--track)!important}
.mrow .av-food{width:52px;height:52px;border-radius:16px}
.tick{width:36px;height:36px}
/* čarobnjak: dugme ne prekriva polja */
.wiz-nav{position:static;margin-top:28px}
body.kb .wiz-nav{display:none}
/* fokus polja */
input:focus,select:focus,textarea:focus{border-color:var(--accent)!important;box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 22%,transparent)}
@media (max-width:360px){.nxt-act{grid-template-columns:1fr 1fr 1fr}.nxt-act .btn{grid-column:1/-1}.rbtn{width:100%}}
body.bigtext .nxt-act{grid-template-columns:1fr 1fr 1fr}
body.bigtext .nxt-act .btn{grid-column:1/-1}
body.bigtext .rbtn{width:100%}
.hab-top .n{white-space:nowrap}
@media (max-width:340px){.hab-top{flex-direction:column;gap:0}.tab{font-size:10px}}

/* ================= v10 ================= */
/* bez smanjivanja pri dodiru, samo talas */
button:active,.btn:active,.rb:active,.rbtn:active,.day:active,.chip-t:active,.qi:active,.sug:active,.act:active,.act-card:active,.mrow .open:active,.ex summary:active,.shop-item:active,.icon-btn:active{transform:none!important}
.rpl-h{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:0}
.rpl{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);animation:rpl .6s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes rpl{to{transform:scale(1);opacity:0}}
button:active,.btn:active{filter:brightness(.96)}
/* prekidač teme */
.thm{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;align-items:center;width:68px;height:36px;border-radius:999px;background:var(--ghost);padding:3px;flex:none}
.thm::before{content:"";position:absolute;top:3px;left:3px;width:30px;height:30px;border-radius:999px;background:var(--card);box-shadow:var(--lift);transition:transform .3s var(--ease)}
.thm[aria-pressed="true"]::before{transform:translateX(32px)}
.thm-i{position:relative;z-index:1;display:grid;place-items:center;color:var(--muted);transition:color .2s}
.thm-i.on{color:var(--accent)}
.thm-i .ic{width:17px;height:17px}
.phead .row,.phead.home{gap:10px}
.phead.home > div:last-child,.phead .row{display:flex;align-items:center}
/* kartica za podsetnike */
.ntf{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.ntf-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in oklab,var(--amber) 16%,transparent);color:var(--amber)}
.ntf-ic .ic{width:24px;height:24px}
.ntf-t{display:grid;gap:2px;min-width:0}.ntf-t b{font-size:15px}.ntf-t span{font-size:13px;color:var(--muted)}
.ntf-a{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
/* makroi: vertikalno, da broj nikad ne izlazi */
.mac{grid-template-columns:auto 1fr!important;grid-template-rows:auto auto;gap:6px 8px;padding:10px;align-items:center;justify-items:start}
.mac svg{grid-row:1!important;grid-column:1;width:26px!important;height:26px!important}
.mac span{grid-row:1;grid-column:2;font-size:11.5px;line-height:1.15;overflow-wrap:anywhere}
.mac b{grid-row:2;grid-column:1/-1;font-size:clamp(13px,4.2vw,16px);white-space:nowrap}
.mac b small{font-size:.72em}
body.bigtext .mac3{grid-template-columns:1fr!important}
body.bigtext .mac{grid-template-columns:auto 1fr auto!important;grid-template-rows:auto}
body.bigtext .mac b{grid-row:1;grid-column:3}
/* opšta zaštita od izlaska van kartice */
.card,.tday,.nxt,.mtn-hero,.hab,.cu-row,.mrow,.kcard,.excard,.progx,.peak,.nums div,.nut div,.cu-tot div,.mac,.sh-row,.tile{min-width:0}
.card > *,.tday > *,.nxt-b > *,.mrow > *,.hab > *,.td-top > *,.nums > *,.nut > *{min-width:0}
.nums b,.nut b,.cu-tot b,.td-k b,.mtn-alt b,.wo-tm b{white-space:nowrap}
.nums div,.nut div,.cu-tot div{overflow:hidden}
.nums b,.nut b,.cu-tot b{font-size:clamp(13px,4.6vw,18px)}
.td-k b{font-size:clamp(32px,11vw,44px)!important}
.sec-title{min-width:0;gap:8px;flex-wrap:wrap}
.sec-title h2{min-width:0;overflow-wrap:anywhere}
.mrow .open,.nm,.nxt-n,.hab-top > b,.pg-t b,.progx b{overflow-wrap:anywhere}
.nxt-m span{white-space:nowrap}
.pill{white-space:nowrap}
.credits span{min-width:0;overflow-wrap:anywhere}
.phead > div:first-child{min-width:0}.phead h1{font-size:clamp(24px,8vw,28px);overflow-wrap:anywhere}
.phead .row{flex:none}
@media (max-width:360px){.peaks{grid-template-columns:1fr}.thm{width:60px;height:34px}.thm::before{width:28px;height:28px}.thm[aria-pressed="true"]::before{transform:translateX(26px)}}
.peak b{min-width:0;overflow-wrap:anywhere}.peak small{white-space:nowrap}
.segtabs{max-width:100%;min-width:0}
.segtabs:not(.scroll) button{flex:1 1 0;min-width:0;padding:0 6px;overflow:hidden;text-overflow:ellipsis}
@media (max-width:340px){.segtabs button{font-size:12.5px}}
.mac{grid-template-columns:1fr!important;grid-template-rows:auto auto auto!important;gap:4px!important}
.mac svg{grid-row:1!important;grid-column:1!important}
.mac b{grid-row:2!important;grid-column:1!important}
.mac span{grid-row:3!important;grid-column:1!important;overflow-wrap:normal!important;word-break:normal;hyphens:manual}
body.bigtext .mac{grid-template-columns:auto 1fr auto!important;grid-template-rows:auto!important}
body.bigtext .mac svg,body.bigtext .mac span,body.bigtext .mac b{grid-row:1!important}
body.bigtext .mac span{grid-column:2!important}body.bigtext .mac b{grid-column:3!important}
.hd-r{display:flex;align-items:center;gap:10px}
</style>
