name: Fotografije jela
on:
  workflow_dispatch:
    inputs:
      mode:
        description: candidates ili final
        default: candidates
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python tools/photos/fetch.py "${{ github.event.inputs.mode }}"
      - uses: actions/upload-artifact@v4
        with:
          name: photos-${{ github.event.inputs.mode }}
          path: out
