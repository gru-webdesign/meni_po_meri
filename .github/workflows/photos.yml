name: Fotografije jela
on:
  workflow_dispatch:
    inputs:
      mode:
        description: candidates ili final
        default: candidates
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python tools/photos/fetch.py "${{ github.event.inputs.mode }}"
      - name: Sačuvaj rezultat u granu photos-work
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -B photos-work
          if [ "${{ github.event.inputs.mode }}" != "final" ]; then mkdir -p tools/photos/review && cp out/* tools/photos/review/ && cp out/candidates.json tools/photos/candidates.json; fi
          git add -A tools/photos www/img/meals
          git commit -m "Fotografije: ${{ github.event.inputs.mode }}" || true
          git push -f origin photos-work
