/* Layout: one-thumb mobile app. Dark summary card on top, tap-to-log tiles, compact meal timeline, details in bottom sheets, fixed tab bar.
   Shape rule: cards 20px, inputs 12px, every button and chip is a full pill. One accent (green); red only for warnings and Coca-Cola. */
:root{
  --bg:#F3F6F2; --surface:#FCFDFB; --sunk:#EBF0EA; --ink:#121613; --muted:#59665D; --line:#DCE4DD;
  --accent:#12803E; --on-accent:#FFFFFF; --accent-soft:#DDF1E3; --accent-ink:#0B5A2B;
  --red:#C9243A; --red-soft:#FBE4E7;
  --night:#131915; --night-2:#1F2822; --night-ink:#EEF4EF; --night-muted:#9EAEA3; --ring-track:#2B362F;
  --font:"Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-card:20px; --r-input:12px;
  --shadow:0 1px 2px rgba(18,40,26,.06), 0 8px 24px rgba(18,40,26,.06);
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0F0C; --surface:#141A16; --sunk:#0F1411; --ink:#ECF2ED; --muted:#98A79D; --line:#243029;
  --accent:#3BCB78; --on-accent:#06120A; --accent-soft:#163522; --accent-ink:#A8EDC3;
  --red:#FF5C70; --red-soft:#3B151B;
  --night:#18211B; --night-2:#222D26; --night-ink:#EEF4EF; --night-muted:#9EAEA3; --ring-track:#2E3B33;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F0C; --surface:#141A16; --sunk:#0F1411; --ink:#ECF2ED; --muted:#98A79D; --line:#243029;
  --accent:#3BCB78; --on-accent:#06120A; --accent-soft:#163522; --accent-ink:#A8EDC3;
  --red:#FF5C70; --red-soft:#3B151B;
  --night:#18211B; --night-2:#222D26; --night-ink:#EEF4EF; --night-muted:#9EAEA3; --ring-track:#2E3B33;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;margin:0;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,p{margin:0}
h1,h2,h3{letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;flex:none;fill:currentColor}
.ic.sm{width:16px;height:16px}
.ic.lg{width:24px;height:24px}
.n{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}

main{max-width:600px;margin:0 auto;padding-block:12px 116px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:grid;gap:14px;animation:viewIn .35s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Page head */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
.phead h1{font-size:28px;font-weight:800}
.phead .sub{font-size:14px;color:var(--muted);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;font-size:13px;font-weight:600;padding:6px 12px;white-space:nowrap}
.pill.soft{background:var(--accent-soft);color:var(--accent-ink)}
.pill.line{border:1px solid var(--line);color:var(--muted)}
.pill.red{background:var(--red-soft);color:var(--red)}

.card{background:var(--surface);border-radius:var(--r-card);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:18px;font-weight:700}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 18px;font-weight:700;font-size:15px;background:var(--accent);color:var(--on-accent);transition:transform .15s var(--ease),opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.redb{background:var(--red);color:#fff}
.btn.sm{padding:8px 14px;font-size:14px}
.btn.block{width:100%}
.icon-btn{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;background:var(--sunk);transition:transform .15s var(--ease)}
.icon-btn:active{transform:scale(.92)}

/* Hero summary */
.hero{background:var(--night);color:var(--night-ink);border-radius:var(--r-card);padding:18px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{position:relative;width:120px;height:120px}
.ring svg{width:120px;height:120px;transform:rotate(-90deg)}
.ring .track{stroke:var(--ring-track)}
.ring .val{stroke:var(--accent);transition:stroke-dashoffset .8s var(--ease)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .mid b{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.03em}
.ring .mid span{font-size:11px;color:var(--night-muted)}
.next{display:grid;gap:10px;min-width:0}
.next .lbl{font-size:12px;color:var(--night-muted);font-weight:600}
.next h2{font-size:19px;font-weight:700;color:var(--night-ink)}
.macro-line{display:flex;gap:14px;font-size:12px;color:var(--night-muted);flex-wrap:wrap}
.macro-line b{display:block;font-family:var(--mono);font-size:15px;color:var(--night-ink);font-weight:600}
.hero .btn{justify-self:start}
.done-msg{display:flex;align-items:center;gap:8px;color:var(--accent);font-weight:700}

/* Quick tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border-radius:var(--r-card);padding:12px;box-shadow:var(--shadow);display:grid;gap:8px;min-width:0}
.tile .t-top{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.tile .t-val{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.tile .t-val small{font-size:12px;color:var(--muted);font-weight:500}
.tile .t-bar{height:4px;border-radius:99px;background:var(--sunk);overflow:hidden}
.tile .t-bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s var(--ease)}
.tile.over .t-bar i{background:var(--red)}
.tile.over .t-val{color:var(--red)}
.tile .t-act{display:grid;grid-template-columns:auto 1fr;gap:6px}
.tile .t-act button{height:36px;white-space:nowrap;border-radius:999px;background:var(--sunk);display:grid;place-items:center;font-weight:700;font-size:13px;transition:transform .15s var(--ease)}
.tile .t-act button.plus{background:var(--accent);color:var(--on-accent)}
.tile.cola .t-act button.plus{background:var(--red);color:#fff}
.tile .t-act button.minus{width:36px}
.tile .t-act button:active{transform:scale(.94)}
.drop-ic{color:#2F8FD8}
.cola-ic{color:var(--red)}
.walk-ic{color:var(--accent)}

/* Meal timeline */
.tl{display:grid}
.mrow{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:10px;padding:10px 0;position:relative}
.mrow + .mrow{border-top:1px solid var(--line)}
.mrow .time{font-family:var(--mono);font-size:13px;color:var(--muted)}
.mrow .open{text-align:left;display:grid;gap:1px;min-width:0;padding:4px 0}
.mrow .open .w{font-size:12px;font-weight:600;color:var(--muted)}
.mrow .open .nm{font-size:15px;font-weight:600;line-height:1.3}
.mrow .open .kc{font-family:var(--mono);font-size:12px;color:var(--muted)}
.mrow.is-next .time{color:var(--accent);font-weight:600}
.mrow.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.tick{width:36px;height:36px;border-radius:999px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;transition:background .2s,border-color .2s,transform .2s var(--ease)}
.tick.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);animation:pop .35s var(--ease)}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}

.tip{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--accent-soft);color:var(--ink);border-radius:var(--r-card);padding:14px 16px}
.tip .ic{color:var(--accent-ink);margin-top:2px}
.tip b{display:block;font-size:14px}
.tip span{font-size:14px;color:var(--muted)}
.tip.red{background:var(--red-soft)}
.tip.red .ic{color:var(--red)}

/* Week strip */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border-radius:999px;padding:8px 0 9px;text-align:center;display:grid;gap:1px;background:var(--surface);box-shadow:var(--shadow);transition:background .2s}
.day b{font-size:13px;font-weight:700}
.day span{font-family:var(--mono);font-size:10px;color:var(--muted)}
.day.on{background:var(--ink);color:var(--bg)}
.day.on span{color:var(--bg);opacity:.7}
.day.today:not(.on) b{color:var(--accent)}
.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.totals div{display:grid;gap:2px}
.totals b{font-family:var(--mono);font-size:18px;font-weight:600}
.totals span{font-size:12px;color:var(--muted)}
.act-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act-card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);padding:14px;display:flex;align-items:center;gap:12px;text-align:left;transition:transform .15s var(--ease)}
.act-card:active{transform:scale(.98)}
.act-card .bubble{width:40px;height:40px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.act-card b{display:block;font-size:14px}
.act-card span{font-size:12px;color:var(--muted)}

/* Swaps */
.swaps{display:grid;gap:12px}
.swap{display:grid;gap:2px}
.swap b{font-size:14px}
.swap span{font-size:14px;color:var(--muted)}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:50}
.sheet-bg{position:absolute;inset:0;background:rgba(8,12,9,.45);opacity:0;transition:opacity .25s}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;max-height:88dvh;overflow:auto;overscroll-behavior:contain;
  background:var(--surface);border-radius:24px 24px 0 0;padding-block:8px calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  transform:translateY(100%);transition:transform .35s var(--ease)}
.sheet.open .sheet-bg{opacity:1}
.sheet.open .sheet-panel{transform:none}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 12px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.sheet-head .w{font-size:13px;font-weight:600;color:var(--accent)}
.sheet-head h2{font-size:22px;font-weight:800;margin-top:2px}
.nut{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:6px;margin-bottom:16px}
.nut div{background:var(--sunk);border-radius:14px;padding:10px 6px;text-align:center;display:grid;gap:1px}
.nut div:first-child{background:var(--night);color:var(--night-ink)}
.nut div:first-child span{color:var(--night-muted)}
.nut b{font-family:var(--mono);font-size:17px;font-weight:600}
.nut span{font-size:11px;color:var(--muted)}
.ingr{display:grid;margin-bottom:14px}
.ingr div{display:grid;grid-template-columns:1fr auto;gap:12px;padding:9px 0;font-size:15px}
.ingr div + div{border-top:1px solid var(--line)}
.ingr .q{font-weight:600;text-align:right}
.ingr .g{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500}
.block-lbl{font-size:13px;font-weight:700;color:var(--muted);margin:4px 0 6px}
.prep{font-size:15px;line-height:1.55;margin-bottom:16px}
.partner{display:flex;gap:10px;align-items:center;background:var(--sunk);border-radius:14px;padding:10px 12px;font-size:14px;margin-bottom:16px}
.partner .ic{color:var(--muted)}
.sheet-actions{display:grid;gap:8px}

/* Shopping */
.shop-group + .shop-group{margin-top:14px}
.shop-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;font-size:15px;cursor:pointer}
.shop-item + .shop-item{border-top:1px solid var(--line)}
.shop-item input{appearance:none;width:24px;height:24px;border-radius:999px;border:2px solid var(--line);margin:0;display:grid;place-items:center;transition:background .2s}
.shop-item input:checked{background:var(--accent);border-color:var(--accent)}
.shop-item input:checked::after{content:"";width:6px;height:11px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.shop-item.done span{text-decoration:line-through;color:var(--muted)}
.shop-item b{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--muted)}

/* Hands */
.hands{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hand{background:var(--sunk);border-radius:16px;padding:14px;display:grid;gap:4px}
.hand b{font-size:16px}
.hand span{font-size:13px;color:var(--muted)}

/* Movement */
.weeks{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wk{scroll-snap-align:start;flex:none;width:132px;border-radius:16px;padding:12px;background:var(--sunk);display:grid;gap:4px}
.wk .wn{font-size:12px;font-weight:700;color:var(--muted)}
.wk b{font-size:14px;line-height:1.3}
.wk .wm{font-family:var(--mono);font-size:12px;color:var(--muted)}
.wk.cur{background:var(--night);color:var(--night-ink)}
.wk.cur .wn,.wk.cur .wm{color:var(--night-muted)}
.wk.past{opacity:.55}
.ex{border-radius:16px;background:var(--sunk)}
.ex + .ex{margin-top:8px}
.ex summary{list-style:none;display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
.ex summary::-webkit-details-marker{display:none}
.ex .num{width:32px;height:32px;border-radius:999px;background:var(--surface);display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:600}
.ex .et b{display:block;font-size:15px}
.ex .et span{font-size:13px;color:var(--muted)}
.ex .car{transition:transform .2s var(--ease);color:var(--muted)}
.ex[open] .car{transform:rotate(90deg)}
.ex p{padding:0 14px 14px 58px;font-size:14px;color:var(--muted)}
.avoid{display:grid;gap:10px}
.avoid div{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:14px;align-items:start}
.avoid .ic{color:var(--red);margin-top:1px}

/* Progress */
.wbig{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.wbig .now b{font-family:var(--mono);font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:1}
.wbig .now span{font-size:13px;color:var(--muted)}
.wbig .delta{display:grid;gap:4px}
.winput{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}
input[type=number],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--sunk);border:1px solid transparent;border-radius:var(--r-input);padding:11px 13px;min-width:0;width:100%}
input[type=number]:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.chart{width:100%;height:auto;display:block;margin-top:12px}
.streak{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.streak .sq{aspect-ratio:1;border-radius:12px;background:var(--sunk);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted)}
.streak .sq.full{background:var(--accent);color:var(--on-accent)}
.streak .sq.part{background:var(--accent-soft);color:var(--accent-ink)}
.streak span{font-size:11px;color:var(--muted)}
.checks{display:grid}
.ck{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 0;cursor:pointer}
.ck + .ck{border-top:1px solid var(--line)}
.ck b{display:block;font-size:15px}
.ck span{font-size:13px;color:var(--muted)}
.ck.done b{text-decoration:line-through;color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
details.settings summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:700;font-size:16px}
details.settings summary::-webkit-details-marker{display:none}
details.settings[open] .car{transform:rotate(90deg)}
.car{transition:transform .2s var(--ease)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;padding:4px 0}
.switch{appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:none;margin:0;cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:999px;background:var(--surface);transition:transform .25s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(18px)}

/* Chat */
.chat-wrap{display:grid;gap:12px}
.msgs{display:grid;gap:10px}
.msg{max-width:86%;padding:11px 14px;border-radius:20px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.msg.u{justify-self:end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:6px}
.msg.a{justify-self:start;background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.msg.a.typing{color:var(--muted)}
.chat-intro{display:grid;justify-items:start;gap:10px;padding:8px 0}
.chat-intro .av{width:48px;height:48px;border-radius:999px;background:var(--night);color:var(--accent);display:grid;place-items:center}
.chat-intro h2{font-size:22px;font-weight:800}
.sugs{display:grid;gap:8px}
.sug{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:12px 16px;font-size:14px;font-weight:500}
.sug .ic{color:var(--muted)}
.composer{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--bg);padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.composer form{max-width:600px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--surface);box-shadow:var(--shadow);border-radius:26px;padding:6px 6px 6px 16px}
.composer textarea{background:transparent;border:0;resize:none;padding:10px 0;height:44px;max-height:120px;font-size:16px}
.composer textarea:focus{border:0}
.send{width:44px;height:44px;border-radius:999px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none;transition:transform .15s var(--ease),opacity .2s}
.send:disabled{opacity:.4}
.chat-pad{height:70px}
.err{background:var(--red-soft);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:14px}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{padding:8px 2px 10px;display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
.tab .ic{width:24px;height:24px}
.tab .bg{position:absolute;top:5px;width:56px;height:30px;border-radius:999px;background:var(--accent-soft);transform:scale(.6);opacity:0;transition:transform .25s var(--ease),opacity .2s}
.tab .ic,.tab span{position:relative}
.tab.on{color:var(--accent-ink)}
.tab.on .bg{transform:none;opacity:1}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,20px);opacity:0;background:var(--night);color:var(--night-ink);
  padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;transition:transform .3s var(--ease),opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast .ic{color:var(--accent)}

@media (max-width:330px){.hero{grid-template-columns:1fr}}
@media (max-width:400px){
  .ring,.ring svg{width:100px;height:100px}.ring .mid b{font-size:20px}.hero{gap:14px;padding:16px}
  .tiles{gap:8px}.tile{padding:10px}.tile .t-val{font-size:17px}
  .nut{grid-template-columns:repeat(3,1fr)}.nut div:first-child{grid-column:span 3}
  .form{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
body{padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}[hidden]{display:none!important}
.note{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:13px;color:var(--muted);align-items:start}
</style>

function chartSVG(){
  const W=S.weights; if(!W.length) return '';
  const w=340,h=170,p={l:30,r:10,t:12,b:20};
  const start=new Date(S.start).getTime(), end=Math.max(new Date(TODAY).getTime(),new Date(W[W.length-1].d).getTime())+21*864e5;
  const pts=W.map(x=>({t:new Date(x.d).getTime(),w:x.w}));
  const plan=[{t:start,w:S.startW},{t:end,w:S.startW-(end-start)/864e5/7*0.85}];
  const all=[...pts.map(x=>x.w),...plan.map(x=>x.w)];
  const lo=Math.floor(Math.min(...all)-1), hi=Math.ceil(Math.max(...all)+1);
  const X=t=>p.l+(t-start)/(end-start)*(w-p.l-p.r), Y=v=>p.t+(hi-v)/(hi-lo)*(h-p.t-p.b);
  const ticks=[lo,R((lo+hi)/2),hi];
  const line=pts.map((x,i)=>(i?'L':'M')+X(x.t).toFixed(1)+' '+Y(x.w).toFixed(1)).join(' ');
  const area=pts.length>1?line+` L${X(pts[pts.length-1].t).toFixed(1)} ${h-p.b} L${X(pts[0].t).toFixed(1)} ${h-p.b} Z`:'';
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Grafikon težine">
   ${ticks.map(v=>`<line x1="${p.l}" x2="${w-p.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${p.l-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" font-family="var(--mono)" fill="var(--muted)">${v}</text>`).join('')}
   <line x1="${X(plan[0].t)}" y1="${Y(plan[0].w)}" x2="${X(plan[1].t)}" y2="${Y(plan[1].w)}" stroke="var(--muted)" stroke-dasharray="4 5" stroke-width="1.5"/>
   ${area?`<path d="${area}" fill="var(--accent)" opacity=".12"/>`:''}
   <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
   <circle cx="${X(last.t)}" cy="${Y(last.w)}" r="5.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/>
  </svg>`;
}

async function setReminders(on){
  const LN=P('LocalNotifications');
  if(!LN){toast('Podsetnici rade u instaliranoj aplikaciji');return false;}
  try{
    const pend=await LN.getPending(); if(pend&&pend.notifications&&pend.notifications.length) await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    if(!on) return true;
    let perm=await LN.checkPermissions(); if(perm.display!=='granted') perm=await LN.requestPermissions();
    if(perm.display!=='granted'){toast('Obaveštenja nisu dozvoljena');return false;}
    const list=[]; let id=1;
    MENU.forEach((day,i)=>{const wd=i===6?1:i+2; day.meals.forEach(m=>{const [h,mi]=m.t.split(':').map(Number);
      list.push({id:id++,title:m.w+' u '+m.t,body:m.n+' · '+R(mealTot(m)[0])+' kcal',smallIcon:'ic_stat_leaf',iconColor:'#12803E',schedule:{on:{weekday:wd,hour:h,minute:mi},allowWhileIdle:true}});});});
    [[10,30],[13,0],[16,0],[21,0]].forEach(([h,mi],k)=>list.push({id:100+k,title:'Čaša vode',body:k===3?'Kako stoji voda danas? Upiši je pre spavanja.':'Popij čašu vode i dodaj je u aplikaciji.',smallIcon:'ic_stat_leaf',iconColor:'#12803E',schedule:{on:{hour:h,minute:mi},allowWhileIdle:true}}));
    list.push({id:200,title:'Vreme za šetnju',body:'Tvoj današnji cilj hodanja čeka. Uspravno, ravnim terenom.',smallIcon:'ic_stat_leaf',iconColor:'#12803E',schedule:{on:{hour:18,minute:15},allowWhileIdle:true}});
    await LN.schedule({notifications:list});
    return true;
  }catch(e){toast('Podsetnici nisu podešeni');return false;}
}

/* ---------- Sheet ---------- */
const sheet=document.getElementById('sheet'), sheetBody=document.getElementById('sheetBody');
let lastFocus=null;
function openSheet(html){
  lastFocus=document.activeElement; sheetBody.innerHTML=html; sheet.hidden=false;
  requestAnimationFrame(()=>requestAnimationFrame(()=>sheet.classList.add('open')));
  const c=sheetBody.querySelector('[data-close]'); if(c) setTimeout(()=>c.focus({preventScroll:true}),50);
}
function closeSheet(){ if(sheet.hidden) return; sheet.classList.remove('open'); setTimeout(()=>{sheet.hidden=true;sheetBody.innerHTML='';if(lastFocus)lastFocus.focus({preventScroll:true})},300); }
const closeBtn=`<button class="icon-btn" data-close="1" aria-label="Zatvori">${ic('x')}</button>`;

function mealSheet(di,mi){
  const m=MENU[di].meals[mi], t=mealTot(m), isToday=di===dIdx(TODAY), on=isToday&&dayOf().m[mi];
  return `<div class="sheet-head"><div><div class="w">${MENU[di].d} · ${m.w} · ${m.t}</div><h2 id="sheetTitle">${esc(m.n)}</h2></div>${closeBtn}</div>
  <div class="nut"><div><b>${R(t[0])}</b><span>kcal</span></div><div><b>${R(t[1])}</b><span>proteini</span></div><div><b>${R(t[2])}</b><span>UH</span></div><div><b>${R(t[3])}</b><span>masti</span></div><div><b>${R(t[4])}</b><span>vlakna</span></div></div>
  <div class="block-lbl">Šta ti treba</div>
  <div class="ingr">${m.i.map(it=>`<div><span>${esc(short(it.k))}</span><span class="q">${esc(it.m)}${S.grams?`<span class="g">${it.g} g</span>`:''}</span></div>`).join('')}</div>
  <div class="partner">${ic('users')}<span>Partner: isti obrok, oko ${R(S.partner*100)}% tvoje porcije, oko ${R(t[0]*S.partner)} kcal</span></div>
  <div class="block-lbl">Priprema</div>
  <p class="prep">${esc(m.r)}</p>
  <div class="sheet-actions">
    ${isToday?`<button class="btn block ${on?'ghost':''}" data-eat="${mi}" data-from-sheet="1">${ic('check','sm')}${on?'Poništi, nisam pojeo':'Pojeo sam'}</button>`:''}
    <button class="btn ghost block" data-ask="Treba mi zamena za ${esc(m.w.toLowerCase())} ${esc(m.n)} (${R(t[0])} kcal). ">${ic('arrows-clockwise','sm')}Treba mi zamena</button>
  </div>`;
}
function shopSheet(){
  const agg={}, mult=1+S.partner;
  MENU.forEach(d=>d.meals.forEach(m=>m.i.forEach(it=>{agg[it.k]=(agg[it.k]||0)+it.g*mult})));
  const wk='w'+weekNo(), done=S.shop[wk]||{};
  const qty=(k,g)=>{const n=N[k];if(n[2])return Math.ceil(g/n[2])+' '+n[1];
    if(n[1]==='ml')return g>=1000?(Math.ceil(g/250)/4).toString().replace('.',',')+' l':Math.ceil(g/50)*50+' ml';
    return g>=1000?(Math.ceil(g/100)/10).toString().replace('.',',')+' kg':Math.ceil(g/50)*50+' g'};
  const catOf=k=>Object.keys(CAT).find(c=>CAT[c].includes(k))||'ostalo';
  const keys=Object.keys(agg), groups={};
  keys.forEach(k=>{(groups[catOf(k)]=groups[catOf(k)]||[]).push(k)});
  const count=keys.filter(k=>done[k]).length;
  return `<div class="sheet-head"><div><div class="w">Nedelja ${weekNo()} · za tebe i partnera</div><h2 id="sheetTitle">Spisak za kupovinu</h2></div>${closeBtn}</div>
  <p class="small muted" style="margin-bottom:14px"><span class="n" id="shopCount">${count}/${keys.length}</span> kupljeno. Količine su zaokružene naviše.</p>
  ${['meso','mlecno','povrce','voce','ostalo'].filter(c=>groups[c]).map(c=>`<div class="shop-group"><div class="block-lbl">${CAT_NAMES[c]}</div>
    ${groups[c].sort((a,b)=>N[a][0].localeCompare(N[b][0],'sr')).map(k=>`<label class="shop-item ${done[k]?'done':''}"><input type="checkbox" data-shop="${k}" ${done[k]?'checked':''}><span>${esc(N[k][0])}</span><b>${qty(k,agg[k])}</b></label>`).join('')}</div>`).join('')}`;
}
function handsSheet(){
  return `<div class="sheet-head"><div><div class="w">Bez kuhinjske vage</div><h2 id="sheetTitle">Tvoja šaka je merica</h2></div>${closeBtn}</div>
  <div class="hands">
    <div class="hand"><b>Dlan</b><span>Meso ili riba veličine i debljine dlana, oko 100 g. Tebi 2 dlana po obroku.</span></div>
    <div class="hand"><b>Pesnica</b><span>Krompir, pirinač, testenina, oko 1 šolja. Tebi 1 pesnica po obroku.</span></div>
    <div class="hand"><b>Šaka</b><span>Povrće: 2 pune šake po obroku, može i više. Voće: 1 šaka.</span></div>
    <div class="hand"><b>Palac</b><span>Ulje, puter od kikirikija, orašasti plodovi, oko 1 kašika. 1 do 2 palca po obroku.</span></div>
  </div>
  <p class="small muted" style="margin-top:14px">Šolja je 250 ml, kašika je supena, kašičica je ona za kafu. Kalorije u aplikaciji su izračunate za te mere, sa greškom od oko 10%. To je sasvim dovoljno za dobar rezultat.</p>`;
}
function backupSheet(txt){
  return `<div class="sheet-head"><div><div class="w">Rezervna kopija</div><h2 id="sheetTitle">${txt?'Kopiraj ovaj tekst':'Nalepi sačuvanu kopiju'}</h2></div>${closeBtn}</div>
  <textarea id="bkTxt" rows="8" style="font-family:var(--mono);font-size:12px;margin-bottom:12px" aria-label="Rezervna kopija" ${txt?'readonly':''}>${esc(txt)}</textarea>
  <div id="bkErr" class="err" hidden style="margin-bottom:12px">Ovo nije ispravna kopija. Nalepi ceo tekst koji si sačuvao.</div>
  ${txt?'':'<button class="btn block" id="bkGo">Vrati podatke</button>'}`;
}
function setupSheet(){
  return `<div class="sheet-head"><div><div class="w">Dobrodošao</div><h2 id="sheetTitle">Dva podatka i krećemo</h2></div>${closeBtn}</div>
  <p class="muted" style="margin-bottom:16px">Na osnovu ovoga računam tvoj dnevni cilj kalorija i proteina. Sve možeš promeniti kasnije u Napretku.</p>
  <div class="form" style="margin-bottom:16px">
    <label for="oAge">Godine<input type="number" id="oAge" inputmode="numeric" value="${S.age}" min="18" max="90"></label>
    <label for="oW">Trenutna težina (kg)<input type="number" id="oW" inputmode="decimal" value="${S.startW}" step="0.1"></label>
    <label for="oP" style="grid-column:1/-1">Partnerova porcija<select id="oP">${[[0.6,'60%, sitnija građa'],[0.75,'75%'],[0.9,'90%'],[1,'100%, ista']].map(o=>`<option value="${o[0]}" ${S.partner==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label>
  </div>
  <button class="btn block" id="oGo">Počni plan</button>`;
}

/* ---------- Toast ---------- */
const toastEl=document.getElementById('toast'); let toastT;
function toast(t){toastEl.innerHTML=ic('check-circle','sm')+esc(t);toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),1800)}

/* ---------- Render ---------- */
function render(){
  const y=window.scrollY;
  app.innerHTML=`<div class="view">${TAB==='danas'?viewDanas():TAB==='jelovnik'?viewJelovnik():TAB==='kretanje'?viewKretanje():TAB==='napredak'?viewNapredak():viewCet()}</div>`;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===TAB));
  document.getElementById('composer').hidden=TAB!=='cet';
  return y;
}
function rerender(){const y=window.scrollY;render();app.firstElementChild.style.animation='none';window.scrollTo(0,y);}
function go(tab){TAB=tab;render();window.scrollTo({top:0});if(tab==='cet'){scrollEnd();const i=document.getElementById('chatIn');if(PREFILL){i.value=PREFILL;PREFILL='';i.focus();}}}

document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)go(b.dataset.tab);});

function handle(e){
  const t=e.target.closest('button,input[type=checkbox],[data-close]'); if(!t) return;
  const ds=t.dataset, d=dayOf();
  if(ds.close){closeSheet();return;}
  if(ds.eat!==undefined){const i=+ds.eat;d.m[i]=!d.m[i];save();if(d.m[i])toast('Obrok zabeležen');
    if(ds.fromSheet){closeSheet();}rerender();return;}
  if(ds.mealOpen!==undefined){openSheet(mealSheet(+ds.dayidx,+ds.mealOpen));return;}
  if(ds.water){d.water=Math.max(0,d.water+ +ds.water);save();rerender();return;}
  if(ds.cola){d.cola=Math.max(0,d.cola+ +ds.cola);save();rerender();return;}
  if(ds.walk){d.walk=Math.max(0,d.walk+ +ds.walk);save();rerender();return;}
  if(ds.ex){d.ex=!d.ex;save();if(d.ex)toast('Vežbe zabeležene');rerender();return;}
  if(ds.day!==undefined){VIEWDAY=+ds.day;rerender();return;}
  if(ds.sheet==='shop'){openSheet(shopSheet());return;}
  if(ds.sheet==='hands'){openSheet(handsSheet());return;}
  if(ds.shop){const wk='w'+weekNo();S.shop[wk]=S.shop[wk]||{};S.shop[wk][ds.shop]=t.checked;save();t.closest('label').classList.toggle('done',t.checked);
    const c=document.getElementById('shopCount');if(c){const tot=sheetBody.querySelectorAll('[data-shop]').length;c.textContent=sheetBody.querySelectorAll('[data-shop]:checked').length+'/'+tot;}return;}
  if(ds.health){S.health[ds.health]=t.checked;save();t.closest('.ck').classList.toggle('done',t.checked);return;}
  if(ds.ask!==undefined){PREFILL=ds.ask;closeSheet();go('cet');return;}
  if(ds.sug){askClaude(ds.sug);return;}
  if(t.id==='gramsT'){S.grams=t.checked;save();return;}
  if(t.id==='notifT'){const want=t.checked;t.disabled=true;setReminders(want).then(ok=>{S.notif=ok?want:false;t.checked=S.notif;t.disabled=false;save();if(ok&&want)toast('Podsetnici su uključeni');});return;}
  if(t.id==='bkCopy'){const txt=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Kopija je u međuspremniku. Sačuvaj je u beleškama.')).catch(()=>{openSheet(backupSheet(txt));});return;}
  if(t.id==='bkRestore'){openSheet(backupSheet(''));return;}
  if(t.id==='bkGo'){try{const o=JSON.parse(document.getElementById('bkTxt').value);if(!o||typeof o!=='object'||!o.days)throw 0;S=Object.assign({},DEF,o);save();closeSheet();toast('Podaci su vraćeni');rerender();}catch(e){const er=document.getElementById('bkErr');er.hidden=false;}return;}
  if(t.id==='wAdd'){const v=parseFloat(String(document.getElementById('wIn').value).replace(',','.'));
    if(v>40&&v<250){S.weights=S.weights.filter(x=>x.d!==TODAY);S.weights.push({d:TODAY,w:v});S.weights.sort((a,b)=>a.d<b.d?-1:1);save();toast('Težina upisana');rerender();}
    else{const i=document.getElementById('wIn');i.focus();i.setAttribute('aria-invalid','true');}return;}
  if(t.id==='resetBtn'){document.getElementById('resetConfirm').hidden=false;return;}
  if(t.id==='resetNo'){document.getElementById('resetConfirm').hidden=true;return;}
  if(t.id==='resetYes'){S.start=TODAY;save();toast('Plan kreće od danas');rerender();return;}
  if(t.id==='oGo'){S.age=+document.getElementById('oAge').value||35;const w=parseFloat(String(document.getElementById('oW').value).replace(',','.'));
    if(w>40&&w<250){S.startW=w;S.weights=[{d:TODAY,w}];}S.partner=+document.getElementById('oP').value;S.setup=true;S.start=TODAY;save();closeSheet();toast('Plan je spreman');rerender();return;}
}
app.addEventListener('click',handle);
sheet.addEventListener('click',handle);
app.addEventListener('change',e=>{const id=e.target.id,v=e.target.value;
  if(id==='sAge')S.age=+v||35;else if(id==='sStart')S.startW=+v||S.startW;else if(id==='sGoal')S.goalW=+v||S.goalW;else if(id==='sPart')S.partner=+v;else return;
  save();rerender();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
const chatIn=document.getElementById('chatIn');
document.getElementById('chatF').addEventListener('submit',e=>{e.preventDefault();const v=chatIn.value;chatIn.value='';chatIn.style.height='';askClaude(v);});
chatIn.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('chatF').requestSubmit();}});
chatIn.addEventListener('input',()=>{chatIn.style.height='44px';chatIn.style.height=Math.min(120,chatIn.scrollHeight)+'px';});

render();
if(!S.setup) setTimeout(()=>openSheet(setupSheet()),400);

/* ---------- Android ---------- */
(function(){
  const App=P('App'); if(!App) return;
  App.addListener('backButton',()=>{ if(!sheet.hidden) closeSheet(); else if(TAB!=='danas') go('danas'); else App.exitApp(); });
  App.addListener('appStateChange',st=>{ if(st.isActive && iso(new Date())!==TODAY) location.reload(); });
})();
</script>
</body>
</html>
