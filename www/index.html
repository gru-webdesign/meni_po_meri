/* Layout: one-thumb mobile app. Dark summary card on top, tap-to-log tiles, compact meal timeline, details in bottom sheets, fixed tab bar.
   Shape rule: cards 20px, inputs 12px, every button and chip is a full pill. One accent (green); red only for warnings and Coca-Cola. */
:root{
  --bg:#F3F6F2; --surface:#FCFDFB; --sunk:#EBF0EA; --ink:#121613; --muted:#59665D; --line:#DCE4DD;
  --accent:#12803E; --on-accent:#FFFFFF; --accent-soft:#DDF1E3; --accent-ink:#0B5A2B;
  --red:#C9243A; --red-soft:#FBE4E7;
  --night:#131915; --night-2:#1F2822; --night-ink:#EEF4EF; --night-muted:#9EAEA3; --ring-track:#2B362F;
  --font:"Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-card:20px; --r-input:12px;
  --shadow:0 1px 2px rgba(18,40,26,.06), 0 8px 24px rgba(18,40,26,.06);
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0F0C; --surface:#141A16; --sunk:#0F1411; --ink:#ECF2ED; --muted:#98A79D; --line:#243029;
  --accent:#3BCB78; --on-accent:#06120A; --accent-soft:#163522; --accent-ink:#A8EDC3;
  --red:#FF5C70; --red-soft:#3B151B;
  --night:#18211B; --night-2:#222D26; --night-ink:#EEF4EF; --night-muted:#9EAEA3; --ring-track:#2E3B33;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F0C; --surface:#141A16; --sunk:#0F1411; --ink:#ECF2ED; --muted:#98A79D; --line:#243029;
  --accent:#3BCB78; --on-accent:#06120A; --accent-soft:#163522; --accent-ink:#A8EDC3;
  --red:#FF5C70; --red-soft:#3B151B;
  --night:#18211B; --night-2:#222D26; --night-ink:#EEF4EF; --night-muted:#9EAEA3; --ring-track:#2E3B33;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;margin:0;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,p{margin:0}
h1,h2,h3{letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;flex:none;fill:currentColor}
.ic.sm{width:16px;height:16px}
.ic.lg{width:24px;height:24px}
.n{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}

main{max-width:600px;margin:0 auto;padding-block:12px 116px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:grid;gap:14px;animation:viewIn .35s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Page head */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
.phead h1{font-size:28px;font-weight:800}
.phead .sub{font-size:14px;color:var(--muted);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;font-size:13px;font-weight:600;padding:6px 12px;white-space:nowrap}
.pill.soft{background:var(--accent-soft);color:var(--accent-ink)}
.pill.line{border:1px solid var(--line);color:var(--muted)}
.pill.red{background:var(--red-soft);color:var(--red)}

.card{background:var(--surface);border-radius:var(--r-card);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:18px;font-weight:700}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 18px;font-weight:700;font-size:15px;background:var(--accent);color:var(--on-accent);transition:transform .15s var(--ease),opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.redb{background:var(--red);color:#fff}
.btn.sm{padding:8px 14px;font-size:14px}
.btn.block{width:100%}
.icon-btn{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;background:var(--sunk);transition:transform .15s var(--ease)}
.icon-btn:active{transform:scale(.92)}

/* Hero summary */
.hero{background:var(--night);color:var(--night-ink);border-radius:var(--r-card);padding:18px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{position:relative;width:120px;height:120px}
.ring svg{width:120px;height:120px;transform:rotate(-90deg)}
.ring .track{stroke:var(--ring-track)}
.ring .val{stroke:var(--accent);transition:stroke-dashoffset .8s var(--ease)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .mid b{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.03em}
.ring .mid span{font-size:11px;color:var(--night-muted)}
.next{display:grid;gap:10px;min-width:0}
.next .lbl{font-size:12px;color:var(--night-muted);font-weight:600}
.next h2{font-size:19px;font-weight:700;color:var(--night-ink)}
.macro-line{display:flex;gap:14px;font-size:12px;color:var(--night-muted);flex-wrap:wrap}
.macro-line b{display:block;font-family:var(--mono);font-size:15px;color:var(--night-ink);font-weight:600}
.hero .btn{justify-self:start}
.done-msg{display:flex;align-items:center;gap:8px;color:var(--accent);font-weight:700}

/* Quick tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border-radius:var(--r-card);padding:12px;box-shadow:var(--shadow);display:grid;gap:8px;min-width:0}
.tile .t-top{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.tile .t-val{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.tile .t-val small{font-size:12px;color:var(--muted);font-weight:500}
.tile .t-bar{height:4px;border-radius:99px;background:var(--sunk);overflow:hidden}
.tile .t-bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s var(--ease)}
.tile.over .t-bar i{background:var(--red)}
.tile.over .t-val{color:var(--red)}
.tile .t-act{display:grid;grid-template-columns:auto 1fr;gap:6px}
.tile .t-act button{height:36px;white-space:nowrap;border-radius:999px;background:var(--sunk);display:grid;place-items:center;font-weight:700;font-size:13px;transition:transform .15s var(--ease)}
.tile .t-act button.plus{background:var(--accent);color:var(--on-accent)}
.tile.cola .t-act button.plus{background:var(--red);color:#fff}
.tile .t-act button.minus{width:36px}
.tile .t-act button:active{transform:scale(.94)}
.drop-ic{color:#2F8FD8}
.cola-ic{color:var(--red)}
.walk-ic{color:var(--accent)}

/* Meal timeline */
.tl{display:grid}
.mrow{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:10px;padding:10px 0;position:relative}
.mrow + .mrow{border-top:1px solid var(--line)}
.mrow .time{font-family:var(--mono);font-size:13px;color:var(--muted)}
.mrow .open{text-align:left;display:grid;gap:1px;min-width:0;padding:4px 0}
.mrow .open .w{font-size:12px;font-weight:600;color:var(--muted)}
.mrow .open .nm{font-size:15px;font-weight:600;line-height:1.3}
.mrow .open .kc{font-family:var(--mono);font-size:12px;color:var(--muted)}
.mrow.is-next .time{color:var(--accent);font-weight:600}
.mrow.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.tick{width:36px;height:36px;border-radius:999px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;transition:background .2s,border-color .2s,transform .2s var(--ease)}
.tick.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);animation:pop .35s var(--ease)}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}

.tip{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--accent-soft);color:var(--ink);border-radius:var(--r-card);padding:14px 16px}
.tip .ic{color:var(--accent-ink);margin-top:2px}
.tip b{display:block;font-size:14px}
.tip span{font-size:14px;color:var(--muted)}
.tip.red{background:var(--red-soft)}
.tip.red .ic{color:var(--red)}

/* Week strip */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border-radius:999px;padding:8px 0 9px;text-align:center;display:grid;gap:1px;background:var(--surface);box-shadow:var(--shadow);transition:background .2s}
.day b{font-size:13px;font-weight:700}
.day span{font-family:var(--mono);font-size:10px;color:var(--muted)}
.day.on{background:var(--ink);color:var(--bg)}
.day.on span{color:var(--bg);opacity:.7}
.day.today:not(.on) b{color:var(--accent)}
.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.totals div{display:grid;gap:2px}
.totals b{font-family:var(--mono);font-size:18px;font-weight:600}
.totals span{font-size:12px;color:var(--muted)}
.act-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act-card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);padding:14px;display:flex;align-items:center;gap:12px;text-align:left;transition:transform .15s var(--ease)}
.act-card:active{transform:scale(.98)}
.act-card .bubble{width:40px;height:40px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.act-card b{display:block;font-size:14px}
.act-card span{font-size:12px;color:var(--muted)}

/* Swaps */
.swaps{display:grid;gap:12px}
.swap{display:grid;gap:2px}
.swap b{font-size:14px}
.swap span{font-size:14px;color:var(--muted)}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:50}
.sheet-bg{position:absolute;inset:0;background:rgba(8,12,9,.45);opacity:0;transition:opacity .25s}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;max-height:88dvh;overflow:auto;overscroll-behavior:contain;
  background:var(--surface);border-radius:24px 24px 0 0;padding-block:8px calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  transform:translateY(100%);transition:transform .35s var(--ease)}
.sheet.open .sheet-bg{opacity:1}
.sheet.open .sheet-panel{transform:none}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 12px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.sheet-head .w{font-size:13px;font-weight:600;color:var(--accent)}
.sheet-head h2{font-size:22px;font-weight:800;margin-top:2px}
.nut{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:6px;margin-bottom:16px}
.nut div{background:var(--sunk);border-radius:14px;padding:10px 6px;text-align:center;display:grid;gap:1px}
.nut div:first-child{background:var(--night);color:var(--night-ink)}
.nut div:first-child span{color:var(--night-muted)}
.nut b{font-family:var(--mono);font-size:17px;font-weight:600}
.nut span{font-size:11px;color:var(--muted)}
.ingr{display:grid;margin-bottom:14px}
.ingr div{display:grid;grid-template-columns:1fr auto;gap:12px;padding:9px 0;font-size:15px}
.ingr div + div{border-top:1px solid var(--line)}
.ingr .q{font-weight:600;text-align:right}
.ingr .g{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500}
.block-lbl{font-size:13px;font-weight:700;color:var(--muted);margin:4px 0 6px}
.prep{font-size:15px;line-height:1.55;margin-bottom:16px}
.partner{display:flex;gap:10px;align-items:center;background:var(--sunk);border-radius:14px;padding:10px 12px;font-size:14px;margin-bottom:16px}
.partner .ic{color:var(--muted)}
.sheet-actions{display:grid;gap:8px}

/* Shopping */
.shop-group + .shop-group{margin-top:14px}
.shop-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;font-size:15px;cursor:pointer}
.shop-item + .shop-item{border-top:1px solid var(--line)}
.shop-item input{appearance:none;width:24px;height:24px;border-radius:999px;border:2px solid var(--line);margin:0;display:grid;place-items:center;transition:background .2s}
.shop-item input:checked{background:var(--accent);border-color:var(--accent)}
.shop-item input:checked::after{content:"";width:6px;height:11px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.shop-item.done span{text-decoration:line-through;color:var(--muted)}
.shop-item b{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--muted)}

/* Hands */
.hands{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hand{background:var(--sunk);border-radius:16px;padding:14px;display:grid;gap:4px}
.hand b{font-size:16px}
.hand span{font-size:13px;color:var(--muted)}

/* Movement */
.weeks{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wk{scroll-snap-align:start;flex:none;width:132px;border-radius:16px;padding:12px;background:var(--sunk);display:grid;gap:4px}
.wk .wn{font-size:12px;font-weight:700;color:var(--muted)}
.wk b{font-size:14px;line-height:1.3}
.wk .wm{font-family:var(--mono);font-size:12px;color:var(--muted)}
.wk.cur{background:var(--night);color:var(--night-ink)}
.wk.cur .wn,.wk.cur .wm{color:var(--night-muted)}
.wk.past{opacity:.55}
.ex{border-radius:16px;background:var(--sunk)}
.ex + .ex{margin-top:8px}
.ex summary{list-style:none;display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
.ex summary::-webkit-details-marker{display:none}
.ex .num{width:32px;height:32px;border-radius:999px;background:var(--surface);display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:600}
.ex .et b{display:block;font-size:15px}
.ex .et span{font-size:13px;color:var(--muted)}
.ex .car{transition:transform .2s var(--ease);color:var(--muted)}
.ex[open] .car{transform:rotate(90deg)}
.ex p{padding:0 14px 14px 58px;font-size:14px;color:var(--muted)}
.avoid{display:grid;gap:10px}
.avoid div{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:14px;align-items:start}
.avoid .ic{color:var(--red);margin-top:1px}

/* Progress */
.wbig{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.wbig .now b{font-family:var(--mono);font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:1}
.wbig .now span{font-size:13px;color:var(--muted)}
.wbig .delta{display:grid;gap:4px}
.winput{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}
input[type=number],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--sunk);border:1px solid transparent;border-radius:var(--r-input);padding:11px 13px;min-width:0;width:100%}
input[type=number]:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.chart{width:100%;height:auto;display:block;margin-top:12px}
.streak{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.streak .sq{aspect-ratio:1;border-radius:12px;background:var(--sunk);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted)}
.streak .sq.full{background:var(--accent);color:var(--on-accent)}
.streak .sq.part{background:var(--accent-soft);color:var(--accent-ink)}
.streak span{font-size:11px;color:var(--muted)}
.checks{display:grid}
.ck{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 0;cursor:pointer}
.ck + .ck{border-top:1px solid var(--line)}
.ck b{display:block;font-size:15px}
.ck span{font-size:13px;color:var(--muted)}
.ck.done b{text-decoration:line-through;color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
details.settings summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:700;font-size:16px}
details.settings summary::-webkit-details-marker{display:none}
details.settings[open] .car{transform:rotate(90deg)}
.car{transition:transform .2s var(--ease)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;padding:4px 0}
.switch{appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:none;margin:0;cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:999px;background:var(--surface);transition:transform .25s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(18px)}

/* Chat */
.chat-wrap{display:grid;gap:12px}
.msgs{display:grid;gap:10px}
.msg{max-width:86%;padding:11px 14px;border-radius:20px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.msg.u{justify-self:end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:6px}
.msg.a{justify-self:start;background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.msg.a.typing{color:var(--muted)}
.chat-intro{display:grid;justify-items:start;gap:10px;padding:8px 0}
.chat-intro .av{width:48px;height:48px;border-radius:999px;background:var(--night);color:var(--accent);display:grid;place-items:center}
.chat-intro h2{font-size:22px;font-weight:800}
.sugs{display:grid;gap:8px}
.sug{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:12px 16px;font-size:14px;font-weight:500}
.sug .ic{color:var(--muted)}
.composer{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--bg);padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.composer form{max-width:600px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--surface);box-shadow:var(--shadow);border-radius:26px;padding:6px 6px 6px 16px}
.composer textarea{background:transparent;border:0;resize:none;padding:10px 0;height:44px;max-height:120px;font-size:16px}
.composer textarea:focus{border:0}
.send{width:44px;height:44px;border-radius:999px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none;transition:transform .15s var(--ease),opacity .2s}
.send:disabled{opacity:.4}
.chat-pad{height:70px}
.err{background:var(--red-soft);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:14px}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{padding:8px 2px 10px;display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
.tab .ic{width:24px;height:24px}
.tab .bg{position:absolute;top:5px;width:56px;height:30px;border-radius:999px;background:var(--accent-soft);transform:scale(.6);opacity:0;transition:transform .25s var(--ease),opacity .2s}
.tab .ic,.tab span{position:relative}
.tab.on{color:var(--accent-ink)}
.tab.on .bg{transform:none;opacity:1}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,20px);opacity:0;background:var(--night);color:var(--night-ink);
  padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;transition:transform .3s var(--ease),opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast .ic{color:var(--accent)}

@media (max-width:330px){.hero{grid-template-columns:1fr}}
@media (max-width:400px){
  .ring,.ring svg{width:100px;height:100px}.ring .mid b{font-size:20px}.hero{gap:14px;padding:16px}
  .tiles{gap:8px}.tile{padding:10px}.tile .t-val{font-size:17px}
  .nut{grid-template-columns:repeat(3,1fr)}.nut div:first-child{grid-column:span 3}
  .form{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

img{max-width:100%}[hidden]{display:none!important}
.note{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:13px;color:var(--muted);align-items:start}

/* ---- v2 dodaci ---- */
body{padding-top:env(safe-area-inset-top,0px)}
.avatar{width:40px;height:40px;border-radius:999px;background:var(--night);color:var(--night-ink);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.avatar .ic{width:22px;height:22px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:600;font-size:14px;margin-bottom:6px}

.mbar{display:grid;gap:5px}
.mb-top{display:flex;justify-content:space-between;font-size:12px;color:var(--night-muted)}
.mb-top .n{color:var(--night-ink);font-size:12px}
.mb-top em{font-style:normal;color:var(--night-muted)}
.mb-track{height:6px;border-radius:99px;background:var(--ring-track);overflow:hidden}

.next-card{display:grid;gap:10px}
.nc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}

.nc-name{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.nc-name .ic{color:var(--muted);flex:none}
.next-card .row{flex-wrap:wrap;gap:8px}

.tick.half{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}

.kbars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end}

.kb-col{position:relative;width:100%;max-width:34px;height:120px;background:var(--sunk);border-radius:10px;overflow:hidden}

.wp b{font-size:12px}

.wp em .ic{width:11px;height:11px}

/* Forme */
.fields{display:grid;gap:16px}

.fld input,.fld select{font-weight:500}

function foodLookup(q){const nq=' '+norm(q)+' ';let best=null;FOODS.forEach(f=>{const n=f[0];const st=(!n.includes(' ')&&n.length>=4)?n.slice(0,-1):n;if(nq.includes(' '+n)||nq.includes(' '+st)){if(!best||n.length>best[0].length)best=f}});return best}

/* Akcije iz odgovora */
function runAct(a){
  const [type,...rest]=a.split(':');const arg=rest.join(':');
  if(type==='swap'){const [key,slot]=arg.split('|');const nx=swapMeal(key,+slot);ask('Šta je novo za '+TYPE_NAMES[planFor(key)[+slot].type].toLowerCase()+'?');toast('Novo jelo: '+nx.n);return}
  if(type==='add'){const [n,k,p,c,f]=arg.split('|');addExtra(n,+k,+p||0,+c||0,+f||0);return}
  if(type==='go'){go(arg);return}
  if(type==='open'){const [key,slot]=arg.split('|');openSheet(mealSheet(key,+slot));return}
  if(type==='sheet'){if(arg==='shop')openSheet(shopSheet());else if(arg==='add')openSheet(addSheet());return}
  if(type==='ask'){ask(arg);return}
}

/* Pomoćno: odgovor o obroku */
function mealText(x,key){const m=x.meal;return `**${TYPE_NAMES[x.type]} u ${x.time}: ${m.n}**\n${R(m.nt[0])} kcal · P ${R(m.nt[1])} g · UH ${R(m.nt[2])} g · M ${R(m.nt[3])} g\n${m.items.map(it=>'- '+shortName(it.k)+': '+measure(it)).join('\n')}`}
function whichDay(q){if(/\bsutra\b/.test(q))return addDays(TODAY,1);if(/\bjuce\b/.test(q))return addDays(TODAY,-1);const dn=['ponedelj','utor','sred','cetvrt','petak','petk','subot','nedelj'],map=[0,1,2,3,4,4,5,6];for(let i=0;i<dn.length;i++)if(q.includes(dn[i])){const target=map[i],cur=dIdx(TODAY);return addDays(TODAY,(target-cur+7)%7)}return TODAY}
function whichType(q){if(/dorucak|doruck/.test(q))return 'd';if(/uzin/.test(q))return 's';if(/rucak|rucku|rucka/.test(q))return 'l';if(/vecer/.test(q))return 'v';return null}
const dayLabel=k=>k===TODAY?'danas':k===addDays(TODAY,1)?'sutra':DAYN[dIdx(k)].toLowerCase();

 {k:['holester','lipid','trigliceri','srce','pritis','so ','soli','slan'],a:()=>`**Holesterol i pritisak**\n- Masna riba (losos, skuša, sardine) 2 puta nedeljno.\n- Ovas, mahunarke, orasi i maslinovo ulje svakog dana.\n- Manje: kobasice, slanina, kajmak, prženo, peciva, slatkiši.\n- So: bez dosoljavanja za stolom, kiseli kupus isperi, pazi na suhomesnato i čips.\n- Gubitak 5 do 10% kilaže sam po sebi primetno popravlja holesterol i pritisak.\nNalaz ponovi kod lekara posle 3 meseca plana.`},

 {k:['uvece','nocu','kasno','pred spavanj','grickal','frizider','tv'],a:()=>`**Prejedanje uveče**\n- Najčešći uzrok je premalo hrane tokom dana, naročito bez doručka i užina.\n- Užina oko 17h je obavezna, a večera sa dosta proteina.\n- Posle večere opere se zub, a kuhinja se „zatvara”.\n- Ako baš moraš: šolja čaja, kiseli krastavac, šargarepa, ili kefir.\n- Grickalice ne drži na vidnom mestu.`},
 {k:['cips','grick','smoki','kokic','keks'],a:()=>`**Grickalice**\nMala kesa čipsa ima oko 215 kcal, a uz film se lako pojedu dve. Zamene: velika činija kokica iz šerpe bez ulja (oko 100 kcal), pečena leblebija, šargarepa sa humusom, šaka badema. Grickaj iz činije, nikad iz kese.`,acts:[['Dodaj čips u dnevnik','add:Čips, mala kesa|215|3|20|14']]},
 {k:['dorucak','nemam vreme','brz','brzo','zuri'],a:()=>`**Brz doručak**\n- Ovsena kaša preko noći: večeras pomešaš ovas, mleko i jogurt, ujutru dodaš voće.\n- 2 kuvana jajeta (skuvaj 6 nedeljom) i kriška hleba.\n- Grčki jogurt sa voćem i orasima.\n- Heljdin hleb sa avokadom.\nDoručak je ono što drži energiju do ručka i smanjuje glad uveče. Ne preskači ga.`,more:['Šta je sutra za doručak?']},
 {k:['priprem','meal prep','unapred','nedelj kuv','spremi'],a:()=>`**Priprema unapred**\nNedeljom uveče, 45 minuta:\n- Skuvaj 6 do 8 jaja.\n- Ispeci pleh piletine ili ćuretine za 2 do 3 dana.\n- Skuvaj lonac pirinča ili heljde.\n- Iseci povrće u kutije.\n- Ovsenu kašu za ponedeljak stavi u frižider.\nRučak kuvaj duplo, pa je ostatak večera ili sutrašnji ručak.`,acts:[['Spisak za kupovinu','sheet:shop']]},
 {k:['kupovin','kupim','prodavn','market','spisak'],a:()=>`Spisak za ovu nedelju je napravljen iz tvog jelovnika i grupisan po delovima prodavnice${S.p.partner==='da'?', sa količinama za tebe i partnera':''}.`,acts:[['Otvori spisak','sheet:shop']]},
 {k:['partner','supru','zen','muz','porodic','deca','dete','klinc'],a:()=>`**Porodica i partner**\nJelovnik je pravljen tako da svi jedu isto, samo različite porcije.${S.p.partner==='da'?` Partnerova porcija je ${R(S.p.partnerPct*100)}% tvoje.`:''}\n- Deca jedu isto, uz dodatak hleba, voća i mlečnog po potrebi.\n- Grickalice za decu drži van vidokruga.\n- Kad deca donesu virus: češće pranje ruku, odvojeni peškiri i dovoljno sna za sve.`},
 {k:['imunit','prehlad','grip','virus','razbol','kasalj','temperatur'],a:()=>`**Imunitet**\n- San 7 do 8 sati je najjači „suplement”.\n- Vitamin C iz hrane: paprika, kivi, pomorandža, kupus, brokoli.\n- Cink: bundevine semenke, meso, mahunarke.\n- Kefir, kiselo mleko i kiseli kupus za creva.\n- Vitamin D preko zime, doza po nalazu, uz lekara.\n- Kad si bolestan: tople supe, dosta tečnosti, umesto treninga samo kratka šetnja. Ne gladuj.\n- Visoka temperatura duže od 3 dana ili otežano disanje traže lekara.`},
 {k:['vitamin','suplement','tablet','magnez','omega','cink'],a:()=>`**Suplementi**\nVećina vitamina dolazi iz hrane koju plan već sadrži. Zimi vredi proveriti vitamin D krvnim testom, jer je kod nas čest nedostatak. Omega-3 dobijaš iz ribe dva puta nedeljno. Bilo koji suplement u većoj dozi dogovori sa lekarom, posebno ako piješ lekove. „Detoks” preparati i tablete za mršavljenje nemaju smisla.`},
 {k:['umor','umoran','iscrplj','energij','pospan','budim'],a:()=>{const ds=[...Array(7)].map((_,i)=>S.days[addDays(TODAY,-i)]).filter(d=>d&&d.sleep!=null);const av=ds.length?ds.reduce((a,d)=>a+d.sleep,0)/ds.length:null;return `**Umor**\n${av?`Prosečno spavaš ${fmt1(av)} h u poslednjih 7 dana.\n`:''}Ako se budiš umoran i posle 8 sati sna, vredi proveriti:\n- Analize krvi: gvožđe i feritin, B12, vitamin D, TSH (štitna žlezda), šećer.\n- Hrkanje i pauze u disanju tokom sna (apneja). Česta je kod veće kilaže i lako se dijagnostikuje.\n- Kofein posle 15h i gazirano uveče.\n- Ekran do kasno.\nKad kilaža krene da pada, energija se obično primetno popravi za 3 do 4 nedelje.`},more:['Kako da spavam bolje?']},
 {k:['san','spav','nesanic','spavanj'],a:()=>`**Bolji san**\n- Isto vreme odlaska u krevet i buđenja, i vikendom.\n- Bez kafe posle 15h i bez gaziranog uveče.\n- Laka večera, 2 do 3 sata pre spavanja.\n- Ekran dalje sat pre spavanja, soba hladna i tamna.\n- Šetnja tokom dana poboljšava san.\nLoš san pojačava glad sutradan, posebno za slatkim.`},
 {k:['hernij','kicm','ledj','disk','krst','isijas','bol u'],a:()=>`**Kičma i diskus hernija**\n- Hodanje je najbolja aktivnost: rasterećuje diskove i troši kalorije.\n- Vežbe stabilnosti (pregib po McGillu, ptica-pas, most) jačaju trup bez pritiska na disk. Pokaži ih fizijatru.\n- Izbegavaj trbušnjake, pretklone sa teretom, uvrtanje i dugo sedenje.\n- Svaki skinut kilogram smanjuje opterećenje kičme.\n- Hitno lekaru: slabost u nozi, trnjenje u preponama ili problem sa mokrenjem.\n- Ako bol ide niz nogu ili se pojačava, prekini vežbe i javi se fizijatru.`,acts:[['Otvori trening','go:trening']],more:['Koliko da hodam?','Mogu li da plivam?']},
 {k:['hod','setn','korak','koracim'],a:()=>{const d=dayOf();return `**Hodanje**\nTvoj cilj ove nedelje je ${walkT()} minuta dnevno, danas imaš ${d.walk}.\n- Može u delovima: 10 minuta posle svakog obroka odlično spušta šećer u krvi.\n- Ravan teren, dobre patike, uspravno držanje, ruke se slobodno njišu.\n- Svake nedelje dodaj 5 minuta.\n- 30 minuta brzog hoda je otprilike 3.000 do 4.000 koraka i oko 150 kcal kod tvoje kilaže.`},acts:[['+10 min hoda','go:trening']]},
 {k:['pliv','bazen','voda vezb','akva'],a:()=>`**Plivanje**\nPlivanje i hodanje u vodi rasterećuju kičmu i odlične su aktivnosti uz višak kilograma. Kod diskus hernije je obično bolji kraul i leđni stil nego prsni sa glavom iznad vode, koji izvija vrat i donji deo leđa. Pre početka pitaj fizijatra.`},
 {k:['trening','vezb','teretan','snag','misic','trbusnj','cucanj','sklek'],a:()=>{const tr=trainingToday();return `**Trening**\nDanas: ${tr.title}.\n${tr.ex.length?tr.ex.map(e=>'- '+e[0]+': '+e[1]).join('\n'):'- Samo hod.'}\n${tr.note?tr.note+'\n':''}Za mršavljenje najviše radi ishrana, a trening čuva mišiće i kičmu. Doslednost je važnija od intenziteta.`},acts:[['Otvori trening','go:trening']]},
 {k:['sedim','sedenj','kancelar','posao','racunar','stolic'],a:()=>`**Sedeći posao**\n- Ustani na svakih 30 do 45 minuta i prošetaj 2 minuta.\n- Monitor u visini očiju, stopala na podu, leđa naslonjena.\n- Telefonske razgovore vodi u hodu.\n- Stepenice umesto lifta kad možeš.\n- Užinu i vodu imaj na stolu, da ne posežeš za automatom.`},
 {k:['ovas','pahulj','kasa'],a:()=>`Ovsene pahuljice su dobar izbor za doručak: dugo drže sitost, a beta-glukan pomaže kod holesterola. ${P_().gluten?'Uzmi one sa oznakom bez glutena, jer se obične često prave u istim pogonima kao pšenica. ':''}Pet kašika je oko 190 kcal.`},
 {k:['voc','banan','groz','jabuk'],a:()=>`**Voće**\nVoće je u planu 1 do 2 puta dnevno i ne goji samo po sebi. Najbolje uz užinu sa proteinom ili orasima. Banana oko 107 kcal, jabuka 94, šaka grožđa 70. Voćni sokovi i smutiji su druga priča: lako se popije 3 do 4 voćke odjednom.`},
 {k:['povrc','salat'],a:()=>`Povrće jedi koliko želiš: 2 pune šake uz ručak i večeru su minimum. Ima malo kalorija, mnogo vlakana i vitamina, a dobro puni stomak. Kalorije dolaze od ulja i preliva, zato ulje dodaj kašikom.`},
 {k:['ulj','mast','pržen','prz','tigan','fritez','maslac','kajmak'],a:()=>`**Masti i ulje**\nJedna kašika ulja ima oko 90 kcal. Ulje „od oka” je najčešći skriveni izvor kalorija.\n- Meri kašikom, ne sipaj iz flaše.\n- Peci u rerni, na grill tiganju ili u tiganju koji ne lepi.\n- Maslinovo ulje, orasi, avokado i riba su dobre masti. Kajmak, slanina i prženo ostavi za retke prilike.`},
 {k:['meso','crveno','svinj','kobas','sunk','suhomes','salam'],a:()=>`Piletina, ćuretina i riba su najbolji izbor svakog dana. Posna junetina i svinjski file su u redu 1 do 2 puta nedeljno. Suhomesnato (salama, kobasice, slanina, šunka) ima mnogo soli i zasićenih masti, pa ga ostavi za izuzetke, posebno zbog holesterola i pritiska.`},
 {k:['post isprekid','intermit','16 8','gladov','preskac','preskoc'],a:()=>`**Preskakanje obroka i isprekidani post**\nZa tebe nije dobar izbor, bar ne sada. Preskakanje doručka je navika koju menjamo, jer vodi u glad i prejedanje uveče, a želudac lošije podnosi duge pauze. Redovni obroci su osnova ovog plana.`},
 {k:['keto','bez ugljen','detoks','sokovi dijet','dijeta od'],a:()=>`Keto, detoks i druge stroge dijete daju brz početni pad, uglavnom vode, i teško se drže. Ovaj plan je napravljen da možeš da ga držiš mesecima, uz hranu koju voliš i jedeš sa porodicom. Rezultat dolazi od doslednosti, ne od strogoće.`},
 {k:['motivac','odusta','tesko','ne mogu','dosadil','ne ide'],a:()=>{const lost=S.weights.length?S.weights[0].w-curW():0;return `**Kad je teško**\n${lost>0.4?`Već si skinuo ${fmt1(lost)} kg. To je rezultat koji se vidi.\n`:''}- Ne moraš da budeš savršen, dovoljno je da budeš uporan. 80% plana daje odličan rezultat.\n- Gledaj struk i odeću, ne samo vagu.\n- Izaberi jednu stvar za ovu nedelju, na primer doručak svaki dan ili 2 l vode.\n- Loš dan je samo dan. Sledeći obrok je nova prilika.`}},
 {k:['cilj','odrzav','kad stignem','posle dijet'],a:()=>{const eta=etaDate();return `**Cilj i posle cilja**\n${eta?`Ovim tempom do ${S.p.goalW} kg stižeš oko ${monthYear(eta)}.`:'Cilj je dostignut.'}\nNa poslednjih 5 kg tempo se namerno usporava. Kad stigneš, plan prelazi na održavanje: kalorije se podižu do tvoje potrošnje, a navike ostaju iste. Upravo te navike čuvaju kilažu.`}},
 {k:['bezbedn','zdravo','koliko brzo','brzo mrsav','30 kil','mesec'],a:()=>`Bezbedan tempo je 0,5 do 1% telesne težine nedeljno, za tebe oko ${fmt1(rateKg())} kg. Prvih nedelja ide brže zbog vode i izbacivanja gaziranog. Brže od toga se gube mišići, pada imunitet i kilaža se vraća.`},
 {k:['merit','mere','vag','dlan','sak','kasik','solj','kuhinjsk'],a:()=>`**Mere bez vage**\n- Dlan (veličina i debljina): oko 100 g mesa ili ribe.\n- Šolja (250 ml): kuvan pirinač, sočivo, heljda.\n- Šaka: povrće ili voće.\n- Kašika je supena, kašičica je za kafu.\nKalorije su izračunate za te mere, sa greškom od oko 10%, što je dovoljno.`,acts:[['Prikaži mere','go:jelovnik']]},
 {k:['zdravo','cao','pozdrav','hej','dobro jutro','dobar dan'],a:()=>`Zdravo${S.p.name?' '+S.p.name.split(' ')[0]:''}! Pitaj me za jelovnik, kalorije, zamene, trening ili bilo šta oko ishrane.`},
 {k:['hvala','fala','super','odlicno'],a:()=>`Nema na čemu. Tu sam kad god zatreba.`}
];

/* ================= PREPOZNAVANJE ================= */
function answer(raw){
  const q=norm(raw);const T=toks(raw);

  // Upis: pojeo/popio sam ...
  const fl0=foodLookup(q);
  if(fl0&&/(pojeo|popio|pojela|popila|jeo sam|pio sam|smazao|pojedoh)/.test(q)){const m=q.match(/\b(\d+)\b/);const nm=m?Math.min(10,+m[1]):1;const nmz=fl0[0].charAt(0).toUpperCase()+fl0[0].slice(1);
    return {text:`${nmz} (${fl0[1]})${nm>1?' × '+nm:''}: oko **${fl0[2]*nm} kcal**. ${nm*fl0[2]>400?'Nije problem, samo neka sledeći obrok bude lakši i dodaj šetnju.':'Upiši ga da dnevni zbir bude tačan.'}`,acts:[['Upiši u dnevnik','add:'+nmz+(nm>1?' × '+nm:'')+'|'+fl0[2]*nm+'|'+fl0[3]*nm+'|'+fl0[4]*nm+'|'+fl0[5]*nm]],more:['Koliko mi je kalorija ostalo?','Šta ako pojedem više nego što treba?']}}
  // Zašto se cilj menja
  if(/zasto|zbog cega|kako to/.test(q)&&/cilj|kalorij|smanj|promen|porcij/.test(q)){const e=KB.find(x=>x.k.includes('prilagod'));return {text:e.a(),acts:e.acts||[]}}
  // Zamena obroka
  if(/zamen|umesto|ne volim|necu|nemam|drugo jelo|nesto drugo/.test(q)&&(whichType(q)||/obrok|jelo/.test(q))){
    const key=whichDay(q),pl=planFor(key);let type=whichType(q);let x=type?pl.find(p=>p.type===type):null;
    if(!x){const nx=pl.find(p=>!dayOf(key).eat[p.slot])||pl[0];x=nx}
    const alts=pool(x.type).filter(m=>m.id!==x.meal.id).slice(0,4);
    return {text:`Za ${dayLabel(key)} je ${TYPE_NAMES[x.type].toLowerCase()}: **${x.meal.n}**.\nDruge opcije koje odgovaraju tvom profilu:\n${alts.map(m=>'- '+m.n).join('\n')}\nDugme ispod menja jelo, a porcija se računa za tvoj cilj.`,acts:[['Zameni '+TYPE_NAMES[x.type].toLowerCase(),'swap:'+key+'|'+x.slot],['Prikaži recept','open:'+key+'|'+x.slot]]};
  }
  // Zamena namirnice
  const swapFood=[[/ribu|ribe|riba|losos|oslic|tun/,'ribu','piletinu ili ćuretinu (isto dlanova), jaja (2 jajeta umesto 1 dlana) ili leblebiju (pola konzerve umesto dlana).'],[/piletin|meso|ćuret|curet/,'meso','ribu (isti broj dlanova), jaja, posni sir ili mahunarke (šolja sočiva ili pasulja umesto dlana mesa).'],[/jaj/,'jaja','grčki jogurt (pakovanje umesto 2 jajeta), posni sir ili ćureći file.'],[/mlek|jogurt|sir\b|kefir/,'mlečno','mleko i jogurt bez laktoze, ili jaja i humus kao izvor proteina u užini.'],[/hleb|kriš|kris/,'hleb','pirinčane krekere (3 kom umesto kriške), krompir ili šaku kuvane heljde.'],[/pirinac|pirinč|pirinc|krompir|testen/,'prilog','krompir, heljdu, batat ili kukuruzni hleb u istoj količini (šolja ili pesnica).'],[/orah|orasi|badem|kikiriki/,'orašasto','bundevine semenke (1 kašika) ili avokado (četvrtina).']];
  if(/zamen|umesto|nemam|ne volim|cime da|čime/.test(q)){for(const [re,lbl,txt] of swapFood){if(re.test(q))return {text:`Umesto ${lbl.replace('ribu','ribe').replace('meso','mesa').replace('jaja','jaja').replace('hleb','hleba').replace('prilog','priloga')}: ${txt}\nAko ne jedeš nešto stalno, označi to u profilu i jelovnik se sam prilagođava.`,acts:[['Otvori profil','go:profil']]}}}

  // Recept
  if(/kako (da )?(napravim|spremim|se pravi|se sprema)|recept|priprem/.test(q)){
    const m=LIB.map(m=>({m,s:toks(m.n).filter(w=>w.length>3&&q.includes(w.slice(0,5))).length})).sort((a,b)=>b.s-a.s)[0];
    if(m&&m.s>0){const sm=scaleMeal(m.m,sumN(m.m.i)[0]);return {text:`**${m.m.n}**\n${sm.items.map(it=>'- '+shortName(it.k)+': '+measure(it)).join('\n')}\n${m.m.r}`}}
    const t=whichType(q);if(t){const key=whichDay(q),x=planFor(key).find(p=>p.type===t);if(x)return {text:mealText(x,key)+'\n'+x.meal.r,acts:[['Otvori obrok','open:'+key+'|'+x.slot]]}}
  }
  // Šta jedem
  const t=whichType(q);
  if((t&&/sta|šta|koji|kakav|imam|ima|meni|jelovnik|plan|za\b/.test(q))||/sta (jedem|je na meniju|imam danas)|jelovnik za|meni za (danas|sutra)/.test(q)){
    const key=whichDay(q),pl=planFor(key);
    if(t){const xs=pl.filter(p=>p.type===t);return {text:xs.map(x=>mealText(x,key)).join('\n\n'),acts:xs.slice(0,1).map(x=>['Prikaži recept','open:'+key+'|'+x.slot]).concat(key===TODAY?[['Zameni','swap:'+key+'|'+xs[0].slot]]:[]),more:['Koliko mi je kalorija ostalo?','Zamena za '+TYPE_NAMES[t].toLowerCase()]}}
    const tot=pl.reduce((a,x)=>a+x.meal.nt[0],0);return {text:`**Jelovnik za ${dayLabel(key)}** (${R(tot)} kcal)\n${pl.map(x=>`- ${x.time} ${TYPE_NAMES[x.type]}: ${x.meal.n}, ${R(x.meal.nt[0])} kcal`).join('\n')}`,acts:[['Otvori jelovnik','go:jelovnik']]};
  }
  // Kalorije namirnice
  const fl=foodLookup(q);
  if(fl&&/kalor|kcal|koliko|ima li|goji|protein/.test(q)){return {text:`**${fl[0].charAt(0).toUpperCase()+fl[0].slice(1)}** (${fl[1]}): oko ${fl[2]} kcal\nProteini ${fl[3]} g · UH ${fl[4]} g · masti ${fl[5]} g\nTo je ${R(fl[2]/macroT().k*100)}% tvog dnevnog cilja.`,acts:[['Dodaj u dnevnik','add:'+fl[0].charAt(0).toUpperCase()+fl[0].slice(1)+' ('+fl[1]+')|'+fl[2]+'|'+fl[3]+'|'+fl[4]+'|'+fl[5]]],more:['Koliko mi je kalorija ostalo?','Šta da jedem kad izlazimo u restoran?']}}
  // Preostale kalorije
  if(/koliko.*(kalor|kcal)|ostalo|preostal|koliko sam (pojeo|uneo|jeo)|dnevni unos|koliko jos/.test(q)&&!fl){
    const mt=macroT(),tot=dayTotals(),left=mt.k-tot[0];const pl=planFor(TODAY),d=dayOf(),rem=pl.filter(x=>!d.eat[x.slot]);
    return {text:`Danas si uneo **${R(tot[0])} kcal** od ${mt.k}. ${left>=0?`Ostalo je **${R(left)} kcal**.`:`Preko si za **${R(-left)} kcal**, pa neka sledeći obroci budu lakši i dodaj šetnju.`}\nProteini ${R(tot[1])} od ${mt.p} g · UH ${R(tot[2])} od ${mt.c} g · masti ${R(tot[3])} od ${mt.f} g.${rem.length?`\nNeoznačeni obroci u planu: ${rem.map(x=>x.meal.n+' ('+R(x.meal.nt[0])+')').join(', ')}.`:''}`,acts:[['Dodaj van plana','sheet:add']]};
  }
  // Napredak
  if(/koliko sam (skinuo|izgubio|smrsao|oslabio)|kad cu|kada cu|do cilja|moj napredak|kako napredujem|tempo/.test(q)){
    const lost=S.weights.length?S.weights[0].w-curW():0,eta=etaDate(),sl=slopeKgWeek();
    return {text:`Sada si ${fmt1(curW())} kg${lost>0?`, ${fmt1(lost)} kg manje od početka`:''}. ${sl!==null?`Poslednje 3 nedelje: ${fmt1(-sl)} kg nedeljno, a plan je ${fmt1(rateKg())}.`:'Za tempo trebaju bar dva merenja.'}\n${eta?`Do ${S.p.goalW} kg oko ${monthYear(eta)}.`:'Cilj je dostignut.'}`,acts:[['Otvori napredak','go:napredak']]};
  }
  // Trening danas
  if(/(sta|koliko|koji).*(trenir|vezb|hodam|setam|hod)/.test(q)&&/danas|sutra|treba|da/.test(q)){
    const key=whichDay(q),tr=trainingToday(key);return {text:`**${dayLabel(key).charAt(0).toUpperCase()+dayLabel(key).slice(1)}: ${tr.title}**\n- Hod: ${walkT()} minuta\n${tr.ex.map(e=>'- '+e[0]+': '+e[1]).join('\n')}${tr.note?'\n'+tr.note:''}`,acts:[['Otvori trening','go:trening']]};
  }
  // Ciljevi
  if(/koliko (mi )?(treba|trebam|smem)|moj cilj|cilj (kalorij|protein)|koliko (proteina|ugljen|masti)/.test(q)){const mt=macroT();return {text:`Tvoj dnevni cilj: **${mt.k} kcal**, proteini ${mt.p} g, ugljeni hidrati ${mt.c} g, masti ${mt.f} g, voda ${litres(waterT())} l, hod ${walkT()} min.\nIzračunato iz profila i trenutne kilaže, a menja se kako napreduješ.`,acts:[['Otvori profil','go:profil']]}}

  // Baza znanja
  let best=null,bs=0;
  KB.forEach(e=>{let s=0;e.k.forEach(st=>{if(st.includes(' ')){if(q.includes(st))s+=2}else if(T.some(w=>w.startsWith(st)||(w.length>=4&&st.startsWith(w))))s+=1});if(s>bs){bs=s;best=e}});
  if(best&&bs>0){const a=best.a();return {text:a,acts:best.acts||[],more:best.more||null}}
  if(fl)return {text:`**${fl[0]}** (${fl[1]}): oko ${fl[2]} kcal, proteini ${fl[3]} g.`,acts:[['Dodaj u dnevnik','add:'+fl[0]+' ('+fl[1]+')|'+fl[2]+'|'+fl[3]+'|'+fl[4]+'|'+fl[5]]]};
  return {text:`Nisam siguran da sam razumeo. Mogu da pomognem oko:\n- jelovnika i zamena („šta je sutra za ručak”, „zamena za večeru”)\n- kalorija („koliko mi je ostalo”, „koliko kalorija ima burek”)\n- treninga i kičme, imuniteta, sna, restorana, slave, gaziranog\nProbaj da pitaš drugim rečima.`,more:['Šta je danas za večeru?','Koliko mi je kalorija ostalo?','Šta da jedem kad izlazimo u restoran?','Zašto vaga stoji?']};
}

const addDays=(key,n)=>{const d=new Date(key+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const daysBetween=(a,b)=>R((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);

/* ================= STANJE ================= */
const DEFP={name:'',sex:'m',age:35,height:174,weight:112,goalW:80,pace:'brzi',job:'sed',move:'none',trainDays:[0,2,4],bf:'08:00',

const DEF={v:4,setup:false,start:null,p:DEFP,days:{},weights:[],waist:[],adj:0,reviews:[],lastReview:null,ovr:{},chat:[],shop:{},health:{},notif:false,grams:false,updated:0};
const LS='meniPoMeri.v2';

try{

    if(old){const o=JSON.parse(old);
      S.weights=o.weights||[];S.health=o.health||{};S.notif=!!o.notif;S.start=o.start||null;
      Object.entries(o.days||{}).forEach(([k,d])=>{S.days[k]={eat:{},extra:[],water:d.water||0,soda:d.cola||0,walk:d.walk||0,ex:!!d.ex}});
      if(S.weights.length)S.p.weight=S.weights[S.weights.length-1].w; if(o.age)S.p.age=o.age; if(o.goalW)S.p.goalW=o.goalW; if(o.partner)S.p.partnerPct=o.partner;
    }}

if(!S.start)S.start=TODAY;
function save(){S.updated=Date.now();try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
const dayOf=(k=TODAY)=>{const d=S.days[k]||(S.days[k]={eat:{},extra:[],water:0,soda:0,walk:0,ex:false});d.eat=d.eat||{};d.extra=d.extra||[];return d};
const weekNo=()=>Math.max(1,Math.floor(daysBetween(S.start,TODAY)/7)+1);

/* ================= OBRAČUN ================= */
const curW=()=>(!S.setup||!S.weights.length)?+S.p.weight:S.weights[S.weights.length-1].w;
const bmr=(w=curW())=>10*w+6.25*S.p.height-5*S.p.age+(S.p.sex==='m'?5:-161);
const actF=()=>({sed:1.2,stand:1.3,phys:1.45}[S.p.job]||1.2)+({none:0,some:0.08,reg:0.15}[S.p.move]||0);
const tdee=()=>bmr()*actF();
const leftKg=()=>curW()-S.p.goalW;
function phase(){const l=leftKg();if(l<=0.3)return 'odrzavanje';if(l<5)return 'zavrsnica';if(weekNo()<=2)return 'start';return 'gubitak'}
const PHASES={start:['Start','Prve dve nedelje: navike, voda i redovni obroci.'],gubitak:['Gubitak','Stabilan deficit, cilj je doslednost.'],zavrsnica:['Završnica','Blizu si cilja, tempo je namerno sporiji.'],odrzavanje:['Održavanje','Cilj je dostignut. Jedeš koliko trošiš.']};
function rateKg(){const l=leftKg();if(l<=0.3)return 0;let r=curW()*(S.p.pace==='brzi'?0.0075:0.005);r=Math.min(r,1);if(l<5)r*=0.6;return r}
const floorK=()=>R(Math.max(S.p.sex==='m'?1500:1200,bmr()*0.8));
function target(){const t=tdee();let def=rateKg()*7700/7;def=Math.min(def,t*0.25);const k=t-def+(phase()==='odrzavanje'?0:S.adj);return R(Math.max(floorK(),k)/10)*10}
function macroT(){const k=target();const p=R(clamp(1.8*S.p.goalW,1.4*curW()*0.9,2.2*S.p.goalW));const f=R(k*0.28/9);const c=Math.max(80,R((k-p*4-f*9)/4));return {k,p,c,f}}
function waterT(){let ml=clamp(33*curW(),2000,3500);if(S.p.waterNow==='low'){const w=weekNo();ml*=w===1?0.6:w===2?0.8:1}else if(S.p.waterNow==='mid'&&weekNo()===1)ml*=0.85;return R(ml/250)*250}
function sodaPlan(){const base=R((+S.p.soda||0)*1000);if(base<=0)return null;const w=weekNo();
  if(w===1)return {max:Math.max(330,R(base/2/10)*10),t:'Pola od dosadašnjeg',tip:'Drugu polovinu zameni Zero varijantom ili mineralnom vodom sa limunom.'};
  if(w===2)return {max:500,t:'Samo Zero, najviše 0,5 l',tip:'Obični gazirani sok više ne kupuj. Čaša vode pre svakog gaziranog.'};
  if(w===3)return {max:330,t:'Zero najviše 1 limenka',tip:'Samo uz ručak. Kofein posle 15h kvari san.'};
  return {max:0,t:'Gazirano samo vikendom',tip:'Jedna limenka Zero vikendom. Voda je osnovno piće.'}}
const walkT=()=>{const b={none:30,some:40,reg:50}[S.p.move]||30;return Math.min(b+30,b+5*(weekNo()-1))};
function etaDate(){const r=rateKg();if(r<=0)return null;let w=curW(),weeks=0;while(w>S.p.goalW+0.3&&weeks<200){let rr=w*(S.p.pace==='brzi'?0.0075:0.005);rr=Math.min(rr,1);if(w-S.p.goalW<5)rr*=0.6;w-=rr;weeks++}return new Date(Date.now()+weeks*7*864e5)}

/* ================= JELOVNIK ================= */
const SLOTS={3:['d','l','v'],4:['d','l','s','v'],5:['d','s','l','s','v']};
const SHARE={3:[.3,.4,.3],4:[.25,.37,.1,.28],5:[.24,.1,.36,.1,.2]};
const OFFS={3:[0,5.5,11],4:[0,5,8.5,11],5:[0,3,6,9,11.5]};
function exclTags(){const p=S.p,x=[];if(p.gluten)x.push('gluten');if(p.lactose)x.push('laktoza');if(p.noFish||p.veg)x.push('riba');if(p.noPork||p.veg)x.push('svinja');if(p.veg)x.push('meso');if(p.noNuts)x.push('orasasto');return x}
function pool(type){const x=exclTags();const all=LIB.filter(m=>m.t.includes(type));const ok=all.filter(m=>!m.tg.some(t=>x.includes(t)));return ok.length?ok:all}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffled(arr,seed){const a=arr.slice(),r=rng(seed);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const weekIdx=key=>Math.floor(daysBetween('2024-01-01',key)/7);
const nut=it=>{const v=F[it.k],g=it.q*it.g/100;return [v[0]*g,v[1]*g,v[2]*g,v[3]*g,v[4]*g]};
const sumN=items=>items.reduce((a,it)=>{const n=nut(it);return a.map((x,j)=>x+n[j])},[0,0,0,0,0]);
function roundStep(q,st){return Math.max(st,Math.round(q/st)*st)}
function scaleMeal(m,kcal){const base=sumN(m.i)[0];const f=clamp(kcal/base,0.6,1.9);
  const items=m.i.map(it=>Object.assign({},it,{q:it.fix?it.q:roundStep(it.q*f,it.st)}));return {id:m.id,n:m.n,r:m.r,tg:m.tg,items,nt:sumN(items)}}
function timeAdd(hhmm,h){const [a,b]=hhmm.split(':').map(Number);let t=a*60+b+R(h*60);t=R(t/15)*15;return String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function planFor(key){
  const n=+S.p.mealsN||5, slots=SLOTS[n], share=SHARE[n], offs=OFFS[n], kt=target(), di=dIdx(key), wi=weekIdx(key);
  const bf=(di>=5)?timeAdd(S.p.bf,1):S.p.bf;
  let sCount=0;
  return slots.map((type,i)=>{
    const P=pool(type), ord=shuffled(P,wi*97+type.charCodeAt(0)*13+n);
    let rank=type==='s'?sCount++:0;
    let m=ord[(di+rank*3)%ord.length];
    const ov=S.ovr[key]&&S.ovr[key][i]; if(ov){const mm=LIB.find(x=>x.id===ov);if(mm)m=mm}
    return {slot:i,type,time:timeAdd(bf,offs[i]),meal:scaleMeal(m,kt*share[i])};
  });
}
function swapMeal(key,slot){const pl=planFor(key)[slot];const P=pool(pl.type);const i=P.findIndex(m=>m.id===pl.meal.id);
  const used=planFor(key).map(x=>x.meal.id);let nx=P[(i+1)%P.length];for(let k=1;k<P.length;k++){const c=P[(i+k)%P.length];if(!used.includes(c.id)){nx=c;break}}
  S.ovr[key]=S.ovr[key]||{};S.ovr[key][slot]=nx.id;save();return nx}
const QF=q=>{const w=Math.floor(q),fr=q-w;const f=fr>=0.74?'¾':fr>=0.49?'½':fr>=0.24?'¼':'';return (w?w:'')+(f||(w?'':'0'))};
function unitStr(u,q){const f=UNITS[u]||[u,u,u];if(q===1)return f[0];if(q<1||q%1!==0)return f[1];if(q>=2&&q<=4)return f[1];return f[2]}
const measure=it=>QF(it.q)+' '+unitStr(it.u,it.q);
const shortName=k=>N[k][0].split(',')[0].split('(')[0].replace(' bez glutena','').replace(' bez pšenice','').trim();

/* ================= DNEVNIK ================= */
function dayTotals(key=TODAY){const d=S.days[key];if(!d)return [0,0,0,0];let t=[0,0,0,0];
  Object.values(d.eat||{}).forEach(e=>{if(e)t=[t[0]+e.k,t[1]+e.p,t[2]+e.c,t[3]+e.f]});
  (d.extra||[]).forEach(e=>{t=[t[0]+e.k,t[1]+(e.p||0),t[2]+(e.c||0),t[3]+(e.f||0)]});return t}
function eatMeal(key,slot,frac){const d=dayOf(key);const pl=planFor(key)[slot];
  if(!frac){delete d.eat[slot];}else{const n=pl.meal.nt;d.eat[slot]={fr:frac,n:pl.meal.n,k:n[0]*frac,p:n[1]*frac,c:n[2]*frac,f:n[3]*frac}}save()}
function adherence(key){const d=S.days[key];if(!d)return 0;const n=+S.p.mealsN||5;return Object.values(d.eat||{}).reduce((a,e)=>a+(e?e.fr:0),0)/n}

/* ================= PRILAGOĐAVANJE ================= */
function slopeKgWeek(){const ws=S.weights.filter(x=>daysBetween(x.d,TODAY)<=21);if(ws.length<2)return null;
  const xs=ws.map(x=>daysBetween(ws[0].d,x.d)),ys=ws.map(x=>x.w);const n=xs.length,mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;
  let num=0,den=0;xs.forEach((x,i)=>{num+=(x-mx)*(ys[i]-my);den+=(x-mx)**2});if(den===0)return null;return num/den*7}
function runReview(force){
  if(!force){if(daysBetween(S.start,TODAY)<7)return null;if(S.lastReview&&daysBetween(S.lastReview,TODAY)<7)return null}
  const sl=slopeKgWeek();const adh=[...Array(7)].map((_,i)=>adherence(addDays(TODAY,-i))).reduce((a,b)=>a+b)/7;
  const exp=rateKg();let msg,ch=0;
  if(phase()==='odrzavanje'){msg='Na cilju si. Plan je prebačen na održavanje: jedeš koliko trošiš i pratiš kilažu jednom nedeljno.';}
  else if(sl===null){msg='Za proveru tempa trebaju bar dva merenja u poslednje 3 nedelje. Izmeri se ujutru, pre doručka.';}
  else{const loss=-sl;
    if(adh<0.6){msg=`Ove nedelje je pojedeno ${R(adh*100)}% planiranih obroka. Kalorije ne menjam dok se plan ne prati redovnije, jer bi promena bila nagađanje.`;}
    else if(loss<exp*0.35){ch=-100;msg=`Gubiš oko ${fmt1(Math.max(0,loss))} kg nedeljno, a cilj je ${fmt1(exp)} kg. Pošto se držiš plana, cilj spuštam za 100 kcal.`;}
    else if(loss>Math.max(1.2,exp*1.6)){ch=100;msg=`Gubiš ${fmt1(loss)} kg nedeljno, što je prebrzo i troši mišiće. Cilj podižem za 100 kcal.`;}
    else msg=`Tempo je dobar: ${fmt1(loss)} kg nedeljno, uz ${R(adh*100)}% pojedenih obroka. Nastavljamo isto.`;}
  const before=target();
  if(ch){S.adj=clamp(S.adj+ch,-400,300);}
  const after=target(); if(ch&&after===before&&ch<0){msg+=' Već si na najnižem bezbednom unosu, zato ostaje isto. Više hoda pomaže više od manje hrane.';}
  const rv={d:TODAY,msg,ch:after-before,k:after};S.reviews.unshift(rv);S.reviews=S.reviews.slice(0,20);S.lastReview=TODAY;save();return rv}

function chartSVG(){
  const W=S.weights;if(!W.length)return '';
  const w=340,h=170,p={l:30,r:10,t:12,b:20};
  const start=new Date((W[0].d<S.start?W[0].d:S.start)+'T12:00').getTime(), end=Math.max(Date.now(),new Date(W[W.length-1].d+'T12:00').getTime())+21*864e5;
  const pts=W.map(x=>({t:new Date(x.d+'T12:00').getTime(),w:x.w}));
  const r0=pts[0].w*(S.p.pace==='brzi'?0.0075:0.005);
  const plan=[{t:pts[0].t,w:pts[0].w},{t:end,w:Math.max(S.p.goalW,pts[0].w-(end-pts[0].t)/864e5/7*Math.min(1,r0))}];
  const all=[...pts.map(x=>x.w),...plan.map(x=>x.w)];const lo=Math.floor(Math.min(...all)-1),hi=Math.ceil(Math.max(...all)+1);
  const X=t=>p.l+(t-start)/(end-start)*(w-p.l-p.r),Y=v=>p.t+(hi-v)/(hi-lo)*(h-p.t-p.b);
  const ticks=[lo,R((lo+hi)/2),hi];
  const line=pts.map((x,i)=>(i?'L':'M')+X(x.t).toFixed(1)+' '+Y(x.w).toFixed(1)).join(' ');
  const area=pts.length>1?line+` L${X(pts[pts.length-1].t).toFixed(1)} ${h-p.b} L${X(pts[0].t).toFixed(1)} ${h-p.b} Z`:'';
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Grafikon težine">
   ${ticks.map(v=>`<line x1="${p.l}" x2="${w-p.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${p.l-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" font-family="var(--mono)" fill="var(--muted)">${v}</text>`).join('')}
   <line x1="${X(plan[0].t)}" y1="${Y(plan[0].w)}" x2="${X(plan[1].t)}" y2="${Y(plan[1].w)}" stroke="var(--muted)" stroke-dasharray="4 5" stroke-width="1.5"/>
   ${area?`<path d="${area}" fill="var(--accent)" opacity=".12"/>`:''}
   <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
   <circle cx="${X(last.t)}" cy="${Y(last.w)}" r="5.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/></svg>`}

  if(f.t==='check')return `<label class="toggle" for="f_${f.id}">${f.l}<input type="checkbox" class="switch" id="f_${f.id}" data-pf="${f.id}" data-bool="1" ${v?'checked':''}></label>`;
  return '';
}

function md(t){
  const lines=esc(t).split('\n');let out='',inL=false;
  lines.forEach(l=>{let x=l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    if(/^\s*[-•]\s+/.test(x)){if(!inL){out+='<ul>';inL=true}out+='<li>'+x.replace(/^\s*[-•]\s+/,'')+'</li>';}
    else{if(inL){out+='</ul>';inL=false}if(x.trim())out+='<p>'+x+'</p>';}});
  if(inL)out+='</ul>';return out}
function ask(q){q=(q||'').trim();if(!q)return;const a=answer(q);S.chat.push({role:'user',content:q});
  S.chat.push({role:'assistant',content:a.text,acts:a.acts||[],more:a.more||null});if(S.chat.length>60)S.chat=S.chat.slice(-60);save();
  render();setTimeout(scrollEnd,30)}

/* ================= DOGAĐAJI ================= */
function handle(e){
  const t=e.target.closest('button,input[type=checkbox],[data-close]');if(!t)return;const ds=t.dataset;
  if(ds.close){closeSheet();return}
  if(ds.go){go(ds.go);return}
  if(ds.eat!==undefined){const fr=+ds.fr;eatMeal(TODAY,+ds.eat,fr);if(fr)toast(fr<1?'Upisana pola porcije':'Obrok upisan');if(ds.fromSheet)closeSheet();rerender();return}
  if(ds.mealOpen!==undefined){openSheet(mealSheet(ds.key,+ds.mealOpen));return}
  if(ds.swap!==undefined){const nx=swapMeal(ds.key,+ds.swap);toast('Novo jelo: '+nx.n);if(ds.fromSheet){sheetBody.innerHTML=mealSheet(ds.key,+ds.swap)}rerender();return}
  if(ds.trk){const d=dayOf();d[ds.trk]=Math.max(0,(d[ds.trk]||0)+ +ds.v);save();rerender();return}
  if(ds.sleep){const d=dayOf();d.sleep=clamp((d.sleep!=null?d.sleep:S.p.sleep)+ +ds.sleep,3,12);save();rerender();return}
  if(ds.energy){const d=dayOf();d.energy=+ds.energy;if(d.sleep==null)d.sleep=S.p.sleep;save();toast('San i energija upisani');rerender();return}
  if(ds.ex){const d=dayOf();d.ex=!d.ex;save();if(d.ex)toast('Trening upisan');rerender();return}
  if(ds.day){VIEWDAY=ds.day;rerender();return}
  if(ds.delx!==undefined){dayOf().extra.splice(+ds.delx,1);save();rerender();return}
  if(ds.sheet==='shop'){openSheet(shopSheet());return}
  if(ds.sheet==='hands'){openSheet(handsSheet());return}
  if(ds.sheet==='add'){openSheet(addSheet());setTimeout(()=>{const s=document.getElementById('qSearch');s&&s.addEventListener('input',filterQuick)},50);return}
  if(ds.quick!==undefined){const q=QUICK[+ds.quick];addExtra(q[0],q[2],q[3],q[4],q[5]);closeSheet();return}
  if(ds.shop){const wk='w'+weekIdx(TODAY);S.shop[wk]=S.shop[wk]||{};S.shop[wk][ds.shop]=t.checked;save();t.closest('label').classList.toggle('done',t.checked);const c=document.getElementById('shopCount');if(c)c.textContent=sheetBody.querySelectorAll('[data-shop]:checked').length+'/'+sheetBody.querySelectorAll('[data-shop]').length;return}
  if(ds.health){S.health[ds.health]=t.checked;save();t.closest('.ck').classList.toggle('done',t.checked);return}
  if(ds.seg){const v=ds.v;S.p[ds.seg]=(ds.seg==='mealsN')?+v:v;t.parentElement.querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b===t);b.setAttribute('aria-checked',b===t)});profileChanged(TAB==='profil'||ds.seg==='partner');if(TAB==='wizard'&&ds.seg==='partner')rerender();return}
  if(ds.flag){S.p[ds.flag]=!S.p[ds.flag];profileChanged(true);return}
  if(ds.dayi!==undefined){const i=+ds.dayi,a=S.p.trainDays||[];S.p.trainDays=a.includes(i)?a.filter(x=>x!==i):a.concat(i).sort();profileChanged(true);return}
  if(ds.wiz){WIZ=clamp(WIZ+ +ds.wiz,0,FORM.length);rerender();window.scrollTo({top:0});return}
  if(ds.sug){ask(ds.sug);return}
  if(ds.act){runAct(ds.act);return}
  if(t.dataset.bool){S.p[t.dataset.pf]=t.checked;profileChanged(true);return}
  switch(t.id){
    case 'wizGo':{const lw=S.weights.length?S.weights[S.weights.length-1].w:null;if(lw!==+S.p.weight){S.weights=S.weights.filter(x=>x.d!==TODAY);S.weights.push({d:TODAY,w:+S.p.weight});S.weights.sort((x,y)=>x.d<y.d?-1:1)}}S.setup=true;S.start=TODAY;save();if(S.notif)scheduleReminders();go('danas');toast('Plan je spreman');return;
    case 'gramsT':S.grams=t.checked;save();return;
    case 'notifT':{const want=t.checked;t.disabled=true;setReminders(want).then(ok=>{S.notif=ok?want:false;t.checked=S.notif;t.disabled=false;save();if(ok&&want)toast('Podsetnici su uključeni')});return}
    case 'bkCopy':{const txt=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Kopirano. Sačuvaj u beleškama.')).catch(()=>openSheet(backupSheet(txt)));return}
    case 'bkRestore':openSheet(backupSheet(''));return;
    case 'bkGo':try{const o=JSON.parse(document.getElementById('bkTxt').value);if(!o||typeof o!=='object'||!o.days)throw 0;S=Object.assign({},DEF,o);S.p=Object.assign({},DEFP,o.p||{});save();closeSheet();toast('Podaci su vraćeni');rerender()}catch(err){document.getElementById('bkErr').hidden=false}return;
    case 'resetBtn':document.getElementById('resetConfirm').hidden=false;return;
    case 'resetNo':document.getElementById('resetConfirm').hidden=true;return;
    case 'resetYes':S.start=TODAY;S.adj=0;S.lastReview=null;save();toast('Plan kreće od danas');rerender();return;
    case 'wAdd':{const i=document.getElementById('wIn'),v=parseFloat(String(i.value).replace(',','.'));if(v>40&&v<250){S.weights=S.weights.filter(x=>x.d!==TODAY);S.weights.push({d:TODAY,w:v});S.weights.sort((a,b)=>a.d<b.d?-1:1);save();const rv=runReview(false);toast(rv?'Upisano. Plan je proveren.':'Težina upisana');rerender()}else{i.focus();i.setAttribute('aria-invalid','true')}return}
    case 'waistAdd':{const i=document.getElementById('waistIn'),v=parseFloat(String(i.value).replace(',','.'));if(v>40&&v<250){S.waist=S.waist.filter(x=>x.d!==TODAY);S.waist.push({d:TODAY,v});save();toast('Obim upisan');rerender()}else i.focus();return}
    case 'reviewNow':{runReview(true);toast('Plan je proveren');rerender();return}
    case 'cAdd':{const n=document.getElementById('cName').value.trim()||'Obrok van plana',k=+document.getElementById('cKcal').value;if(k>0&&k<5000){addExtra(n,k,0,0,0);closeSheet()}else document.getElementById('cKcal').focus();return}
    case 'chatClear':S.chat=[];save();rerender();return;
  }
}
function addExtra(n,k,p,c,f){const now=new Date();dayOf().extra.push({n,k,p,c,f,t:String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')});save();toast('Dodato: '+n);rerender()}
function filterQuick(e){const q=norm(e.target.value);document.querySelectorAll('#quickList .qi').forEach((b,i)=>{b.hidden=q&&!norm(QUICK[i][0]).includes(q)})}
app.addEventListener('click',handle);sheet.addEventListener('click',handle);
app.addEventListener('change',e=>{const el=e.target;if(!el.dataset.pf||el.dataset.bool)return;let v=el.value;if(el.dataset.num){v=parseFloat(String(v).replace(',','.'));if(isNaN(v))return}
  if(el.dataset.pf==='partnerPct')v=+v;S.p[el.dataset.pf]=v;profileChanged(TAB==='profil')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
const chatIn=document.getElementById('chatIn');
document.getElementById('chatF').addEventListener('submit',e=>{e.preventDefault();const v=chatIn.value;chatIn.value='';chatIn.style.height='';ask(v)});
chatIn.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('chatF').requestSubmit()}});
chatIn.addEventListener('input',()=>{chatIn.style.height='44px';chatIn.style.height=Math.min(120,chatIn.scrollHeight)+'px'});

/* ================= PODSETNICI ================= */
async function setReminders(on){const LN=PL('LocalNotifications');if(!LN){toast('Podsetnici rade u instaliranoj aplikaciji');return false}
  try{if(on){let perm=await LN.checkPermissions();if(perm.display!=='granted')perm=await LN.requestPermissions();if(perm.display!=='granted'){toast('Obaveštenja nisu dozvoljena');return false}}
    await scheduleReminders(on);return true}catch(e){toast('Podsetnici nisu podešeni');return false}}
async function scheduleReminders(on=true){const LN=PL('LocalNotifications');if(!LN)return;
  try{const pend=await LN.getPending();if(pend&&pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
  if(!on)return;const list=[],now=Date.now();const add=(id,at,title,body)=>{if(at.getTime()>now+60000)list.push({id,title,body,schedule:{at,allowWhileIdle:true},smallIcon:'ic_stat_leaf',iconColor:'#12803E'})};
  for(let d=0;d<7;d++){const key=addDays(iso(new Date()),d);planFor(key).forEach(x=>add(1000+d*10+x.slot,new Date(key+'T'+x.time+':00'),TYPE_NAMES[x.type]+' u '+x.time,x.meal.n+' · '+R(x.meal.nt[0])+' kcal'));
    [['10:30','Čaša vode','Popij čašu vode i upiši je.'],['13:00','Čaša vode','Pola dana je prošlo. Kako stoji voda?'],['16:00','Čaša vode','Još jedna čaša do kraja radnog dana.']].forEach((w,k)=>add(2000+d*10+k,new Date(key+'T'+w[0]+':00'),w[1],w[2]));
    add(3000+d,new Date(key+'T18:15:00'),'Vreme za šetnju','Danas je cilj '+walkT()+' minuta hoda.');}
  if(list.length)await LN.schedule({notifications:list})}catch(e){}}

/* ================= ANDROID ================= */
(function(){const A=PL('App');if(!A)return;
  A.addListener('backButton',()=>{if(!sheet.hidden)closeSheet();else if(TAB==='wizard'){if(WIZ>0){WIZ--;rerender()}else A.exitApp()}else if(TAB==='profil')go(prevTab);else if(TAB!=='danas')go('danas');else A.exitApp()});
  A.addListener('appStateChange',st=>{if(st.isActive&&iso(new Date())!==TODAY){TODAY=iso(new Date());VIEWDAY=TODAY;runReview(false);rerender();if(S.notif)scheduleReminders()}})})();

/* ================= START ================= */
if(!S.setup){WIZ=0;TAB='wizard'}
render();
if(S.setup){runReview(false);if(S.notif)scheduleReminders()}

</script>
