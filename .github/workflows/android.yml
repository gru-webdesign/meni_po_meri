name: Android APK i AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
      UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
      UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
      UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
      RC_API_KEY: ${{ secrets.RC_API_KEY }}
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalacija paketa
        run: npm ci

      - name: Podešavanja za naplatu i reklame (APK za testiranje)
        run: echo "window.MPM_CFG={rcKey:'${RC_API_KEY}',test:true,banner:''};" > www/config.js

      - name: Android projekat, ikonice i splash
        run: |
          npx cap add android
          node android-overrides/add-admob-meta.js
          npx capacitor-assets generate --android
          mkdir -p android/app/src/main/res/drawable
          cp assets/ic_stat_leaf.png android/app/src/main/res/drawable/ic_stat_leaf.png
          cp android-overrides/MainActivity.java android/app/src/main/java/rs/gru/menipomeri/MainActivity.java
          npx cap sync android

      - name: Verzija aplikacije
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName|targetSdk" android/app/build.gradle android/variables.gradle

      - name: Stalni ključ za APK (nova verzija se instalira preko stare)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: APK za direktnu instalaciju
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../meni-po-meri.apk

      - name: AAB za Google Play (samo ako su postavljene tajne)
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/upload.jks
          echo "UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV
          cat android-overrides/release-signing.gradle >> android/app/build.gradle

      - name: Pravljenje AAB-a
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        working-directory: android
        run: |
          echo "window.MPM_CFG={rcKey:'${RC_API_KEY}',test:false,banner:'${ADMOB_BANNER_ID}'};" > ../www/config.js
          (cd .. && npx cap copy android)
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../meni-po-meri.aab

      - uses: actions/upload-artifact@v4
        with:
          name: meni-po-meri
          path: |
            meni-po-meri.apk
            meni-po-meri.aab
          if-no-files-found: warn

      - name: Objava u Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Meni po meri 1.0.${{ github.run_number }}
          body: |
            meni-po-meri.apk: instalacija direktno na telefon, nova verzija ide preko stare.
            meni-po-meri.aab: za Google Play (pojavljuje se kad su postavljene tajne za potpis).
          files: |
            meni-po-meri.apk
            meni-po-meri.aab
          fail_on_unmatched_files: false
          make_latest: true
